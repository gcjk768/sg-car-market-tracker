services:
  sg-car-scraper:
    networks: [default, scrape-net]   # shared Playwright server ws://playwright:3000/
    build:
      context: .
      args:
        # 1 installs the Claude Code CLI for the optional ai features.
        WITH_CLAUDE: "1"
    container_name: sg-car-scraper
    # Rebuild on every up, so Dockge Update picks up requirements.txt changes.
    pull_policy: build
    # scheduler.py supervises the report and the listener as child processes, retries failed
    # runs and exits on purpose if its own loop stalls, so Docker restarts it.
    restart: unless-stopped
    # A small init reaps finished child processes such as Chromium.
    init: true
    # Healthy while the scheduler's heartbeat (data/heartbeat) is fresh. Shows in Dockge and
    # `docker ps`. The scheduler restarts itself when it stalls, so this is for visibility.
    healthcheck:
      test: ["CMD", "python", "scheduler.py", "--health"]
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 3m
    stop_grace_period: 30s
    env_file: .env
    environment:
      PLAYWRIGHT_WS_URL: ws://playwright:3000/
      TZ: Asia/Singapore
      # The Claude CLI keeps its login here. It is a host volume below, so signing in once
      # from the container terminal survives restarts and rebuilds.
      CLAUDE_CONFIG_DIR: /root/.claude
      # 1 sends a report as soon as the container starts, useful for the first test.
      RUN_ON_START: "1"
      # 1 also answers /run, /coe and /filters in Telegram.
      RUN_LISTENER: "1"
      # Obsidian vault (movement log and memory), mounted below. Unset to switch it off.
      VAULT_DIR: /vault
    volumes:
      # Code, config, data and logs come straight from this folder, so an update is copy the
      # files and restart. Only a requirements.txt change needs a rebuild.
      - ./:/app
      - ./data/claude:/root/.claude
      # On the NAS, .env sets VAULT_HOST_DIR=/volume1/<USER>/Obsidian/SG Car Market.
      - "${VAULT_HOST_DIR:-./data/vault}:/vault"
    # Keep a terminal available so `docker compose exec -it ... claude auth login` works.
    stdin_open: true
    tty: true
    # Chromium needs a bit of shared memory.
    shm_size: "512m"
    # Chromium plus a self repair (the Claude CLI, the tests and a dry run). Caps a runaway page
    # so the NAS keeps its RAM.
    mem_limit: 2g

networks:
  scrape-net:
    external: true
