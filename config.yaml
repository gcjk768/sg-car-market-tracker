# Singapore car market scraper configuration.
# Every filter, formula and assumption lives here so it can be changed without touching code.
# Each block with a verified_on field records the last date its values were checked against the source.

general:
  timezone: Asia/Singapore
  # Local time at which scheduler.py (the Docker entry point) runs the daily report.
  schedule_time: "08:00"
  # The contact note is appended to the User Agent so site owners can reach you.
  user_agent: "sg-car-scraper/0.1 (personal car shopping research; contact: {contact})"
  # Minimum seconds between requests to the same domain, plus random jitter on top.
  throttle_seconds: 2.0
  throttle_jitter_seconds: 1.5
  request_timeout_seconds: 30
  max_retries: 3
  cache_dir: data/cache
  db_path: data/cars.db
  log_dir: logs
  honour_robots_txt: true

telegram:
  # Send only when something in the watched sections changed since the last report that was
  # sent. The job still runs daily so the database keeps tracking prices. --force always sends.
  send_only_on_change: true
  # Sections compared against the last sent report. Fuel prices are deliberately left out
  # because they move every week and would trigger a message on their own.
  change_sections: [coe, new_ev, used_ev, used_ice]
  # Send a report anyway after this many quiet days. 0 turns the heartbeat off.
  heartbeat_after_days: 0
  max_message_length: 4096
  # Character width of each fixed width table. Sixty reads well on a phone in portrait.
  table_width: 60
  parse_mode: HTML
  disable_web_page_preview: true
  # Order of sections sent, one Telegram message per section.
  section_order:
    - summary
    - coe
    - new_ev
    - used_ev
    - used_ice
    - costs
    - considerations

ai:
  # Optional help from the Claude Code CLI in print mode (claude -p). Off by default because
  # the pipeline does not need it. Turn it on when a site changes layout and the label based
  # parsers start missing fields, or if you want a short analyst note on the summary.
  enabled: false
  command: claude
  # Model alias or id passed to the CLI. Leave null for the CLI default.
  model: null
  timeout_seconds: 120
  max_input_chars: 12000
  # Hard cap on CLI calls per run so a broken parser cannot run up a bill.
  max_calls_per_run: 20
  # Use the model to read a listing only when the label parser missed these fields.
  fallback_when_missing: [price, mileage_km, coe_years_remaining]
  # Three sentence note on the summary section.
  analyst_note: false
  # Extra CLI flags, for example ["--permission-mode", "plan"].
  extra_args: []

sources:
  # Verify each URL before first use. Note any moves in the README.
  sgcarmart_new_cars: "https://www.sgcarmart.com/new_cars/"
  sgcarmart_used_listing: "https://www.sgcarmart.com/used_cars/listing.php"
  sgcarmart_coe_results: "https://www.sgcarmart.com/news/coe_results.php"
  onemotoring_coe: "https://onemotoring.lta.gov.sg/content/onemotoring/home/buying/coe-open-bidding.html"
  # carro.sg redirects to carro.co. Verified base URL, the buy path still needs a check.
  carro_buy: "https://carro.co/sg/en/buy"
  motorist_used: "https://www.motorist.sg/used-cars"
  motorist_used_ev: "https://www.motorist.sg/used-cars/electric-car"
  motorist_coe: "https://www.motorist.sg/coe-results"
  fuel_price: "https://www.motorist.sg/petrol-prices"
  fuel_price_fallback: "https://petrolprice.sg/"
  # Cnergy (Union Gas) publishes its own board. Scraped separately because comparison pages
  # do not always list it.
  cnergy: "https://www.cnergy.sg/"
  lta_tax_structure: "https://onemotoring.lta.gov.sg/content/onemotoring/home/buying/upfront-vehicle-costs/tax-structure.html"
  lta_parf: "https://onemotoring.lta.gov.sg/content/onemotoring/home/buying/rebates/parf-coe-rebate.html"
  mas_loan_rules: "https://www.mas.gov.sg/regulation/explainers/motor-vehicle-loans"
  lta_ves_eeai_extension: "https://www.lta.gov.sg/content/ltagov/en/newsroom/2025/9/news-releases/extension_of_ves_and_eeai_to_support_vehicle_electrification.html"
  lta_parf_revision_2026: "https://www.lta.gov.sg/content/ltagov/en/newsroom/2026/2/news-releases/revision-parf-rebate-schedule-cap.html"
  brand_pages:
    BYD: "https://www.byd.com/sg"
    Tesla: "https://www.tesla.com/en_sg"
    Xpeng: "https://www.xpeng.com/sg"
    Zeekr: "https://www.zeekr.sg"
    MG: "https://www.mg.com.sg"
    GAC Aion: "https://www.aion.sg"
    Deepal: "https://www.deepal.sg"
    Hyundai: "https://www.hyundai.com/sg"
    Kia: "https://www.kia.com/sg"
    Polestar: "https://www.polestar.com/sg"
  insurance_comparison:
    - name: MoneySmart car insurance
      url: "https://www.moneysmart.sg/car-insurance"
    - name: Singsaver car insurance
      url: "https://www.singsaver.com.sg/car-insurance"

coe:
  # Categories shown in the report. Cat D is stored but hidden.
  display_categories: [A, B, C, E]
  store_categories: [A, B, C, D, E]
  trend_window: 6
  # Bidding opens on the first and third Monday of each month and results are out on the Wednesday.
  tender_weeks_of_month: [1, 3]
  results_weekday: 2   # Monday is 0
  # Cat A power ceiling for electric cars in kW. Above this is Cat B. Verify against LTA.
  cat_a_max_power_kw: 110
  cat_a_max_engine_cc: 1600
  cat_a_max_engine_power_kw: 97
  verified_on: "2026-09-29"
  # Scrapers are tried in this order until one returns results.
  source_order: [onemotoring, sgcarmart, motorist]

new_ev:
  top_n: 10
  # Dealer prices in Singapore are advertised with COE and already net of the VES and EEAI
  # rebates, which are applied to ARF at registration. The report says so on every price.
  prices_include_rebates: true
  max_model_pages: 40
  # VES rebates by band for cars registered this year. Single band A from 2026. Verified 2026-09-29.
  ves_rebates:
    A: 22500
    A1: 22500
    A2: 22500
    B: 0
    C1: -15000
    C2: -25000
  # Score is price with COE divided by claimed range. Lower is better.
  score:
    numerator: price_with_coe
    denominator: range_km
    tiebreak: battery_warranty_years_desc
  # Group the new EV list by body type, showing the best value cars in each group.
  group_by_body_type: true
  top_n_per_body_type: 4
  body_type_order: [Hatchback, Sedan, SUV, MPV, Coupe, Wagon, Other]
  # Body type by "make model" when the page does not say. Matching is case insensitive.
  body_type_overrides:
    Tesla Model 3: Sedan
    Tesla Model Y: SUV
    BYD Seal 6: Sedan
    BYD Seal: Coupe
    BYD Atto 1: Hatchback
    BYD Atto 2: SUV
    BYD Atto 3: SUV
    BYD Dolphin: Hatchback
    BYD Sealion 7: SUV
    BYD M6: MPV
    GAC Aion UT: Hatchback
    GAC Aion Y Plus: SUV
    GAC Aion ES: Sedan
    MG 4: Hatchback
    MG MGS5 EV: SUV
    Xpeng G6: SUV
    Zeekr X: SUV
    Leapmotor C10: SUV
    Kia EV5: SUV
    Kia EV3: SUV
    Hyundai Ioniq 5: SUV
    Hyundai Ioniq 6: Sedan
    Deepal S07: SUV
    Polestar 2: Sedan
  always_include:
    - BYD Seal
    - BYD Atto 3
    - Tesla Model 3
    - Tesla Model Y
    - Xpeng G6
    - Zeekr X
    - MG4
    - Aion Y Plus
    - Deepal S07

used:
  top_n: 8
  filters:
    price_ceiling_sgd: 120000
    max_km_per_year_of_age: 15000
    max_owners: 2
    min_coe_years_remaining: 6.0
    max_age_years:
      ev: 6
      ice: 8
      hybrid: 8
    require_mileage: true
    exclude_keywords:
      - accident
      - "as is"
      - "as-is"
      - "no warranty"
      - scrap
      - export
      - salvage
      - flood
    bonus_keywords:
      - "full service history"
      - "agent maintained"
      - "agent serviced"
      - "authorised dealer serviced"
    bonus_score: 0.05   # fraction of depreciation deducted when a bonus keyword is present
  ranking:
    - depreciation_per_year_asc
    - mileage_km_asc
  # How many listing pages to walk per search and how many detail pages to open per run.
  max_list_pages: 3
  max_detail_pages_per_search: 40
  # Search URLs per source and drivetrain group. Apply your filters on the site, then paste the
  # URL of the first results page here. {page} is replaced with the page number.
  searches:
    ev:
      fuel_types: [electric]
      urls:
        sgcarmart: "https://www.sgcarmart.com/used_cars/listing.php?FUE=4&ASL=1&PAGE={page}"
        carro: "https://carro.co/sg/en/buy?fuel_type=electric&page={page}"
        motorist: "https://www.motorist.sg/used-cars/electric-car?page={page}"
    ice:
      fuel_types: [petrol, hybrid, petrol-electric]
      urls:
        sgcarmart: "https://www.sgcarmart.com/used_cars/listing.php?FUE=1,3&ASL=1&PAGE={page}"
        carro: "https://carro.co/sg/en/buy?fuel_type=petrol,hybrid&page={page}"
        motorist: "https://www.motorist.sg/used-cars?page={page}"

costs:
  verified_on: "2026-09-29"
  notes: >
    Road tax bands, the 0.782 factor, the EV flat component, the hybrid rule, the ARF tiers,
    both PARF schedules and the loan rules were checked on the verified_on date against LTA and
    MAS material found through web search. The LTA pages themselves could not be opened from the
    build environment, so open them once yourself before trusting a large decision to these numbers.
  annual_km: 15000
  road_tax:
    # LTA publishes the formulas below as 6 monthly amounts. Annual road tax is the formula
    # multiplied by 12 divided by period_months, plus the flat component for EVs.
    period_months: 6
    # Multiplier that applies to the formulas. LTA publishes the formula with this factor.
    petrol_factor: 0.782
    ev_factor: 0.782
    # Additional Flat Component for fully electric cars, SGD per year (350 per 6 months).
    ev_additional_flat_component: 700
    # Bands are [upper_bound_of_band, base_amount, rate_per_unit_above_previous_bound].
    # For EVs the unit is kW of maximum power rating. The last band has no upper bound.
    ev_power_bands:
      - {up_to: 7.5, base: 200, rate: 0}
      - {up_to: 30, base: 200, rate: 2.0}
      - {up_to: 90, base: 250, rate: 3.75}
      - {up_to: 230, base: 475, rate: 7.5}
      - {up_to: null, base: 1525, rate: 10.0}
    # For petrol cars the unit is cc of engine capacity.
    petrol_cc_bands:
      - {up_to: 600, base: 400, rate: 0}
      - {up_to: 1000, base: 400, rate: 0.25}
      - {up_to: 1600, base: 500, rate: 0.75}
      - {up_to: 3000, base: 950, rate: 1.5}
      - {up_to: null, base: 3050, rate: 2.0}
    # Petrol electric cars: LTA charges the higher of the engine capacity formula and the power
    # rating formula, without the EV additional flat component. Verified 2026-09-29.
    hybrid_rule: max_of_engine_and_power
  insurance:
    assumptions: >
      Driver with 10 years of experience, clean record, 50 percent no claim discount,
      comprehensive cover, private use. Figures are indicative annual premiums in SGD.
    bands:
      # price_up_to is the car price with COE. Drivetrain keys: ev, ice, hybrid.
      - {price_up_to: 80000, ev: [1400, 2200], ice: [1000, 1600], hybrid: [1100, 1800]}
      - {price_up_to: 120000, ev: [1800, 2800], ice: [1300, 2100], hybrid: [1400, 2300]}
      - {price_up_to: 180000, ev: [2300, 3600], ice: [1700, 2800], hybrid: [1900, 3000]}
      - {price_up_to: null, ev: [3000, 4800], ice: [2300, 3800], hybrid: [2500, 4000]}
  depreciation:
    new_car_horizon_years: 10
    # PARF rebate as a percentage of ARF by age at deregistration. The schedule that applies
    # depends on when the car was registered (strictly, when its COE was obtained). Schedules are
    # listed newest first and the first one whose applies_from is on or before the registration
    # date is used. A null cap means no cap.
    parf_schedules:
      - applies_from: "2026-02-13"
        cap_sgd: 30000
        note: "Cars with COEs from the second February 2026 exercise onwards"
        percent_by_age:
          - {age_under: 5, percent: 30}
          - {age_under: 6, percent: 25}
          - {age_under: 7, percent: 20}
          - {age_under: 8, percent: 15}
          - {age_under: 9, percent: 10}
          - {age_under: 10, percent: 5}
      - applies_from: "2023-02-15"
        cap_sgd: 60000
        note: "Cars with COEs from the second February 2023 exercise to 12 February 2026"
        percent_by_age:
          - {age_under: 5, percent: 75}
          - {age_under: 6, percent: 70}
          - {age_under: 7, percent: 65}
          - {age_under: 8, percent: 60}
          - {age_under: 9, percent: 55}
          - {age_under: 10, percent: 50}
      - applies_from: "1900-01-01"
        cap_sgd: null
        note: "Cars registered before 15 February 2023, no cap"
        percent_by_age:
          - {age_under: 5, percent: 75}
          - {age_under: 6, percent: 70}
          - {age_under: 7, percent: 65}
          - {age_under: 8, percent: 60}
          - {age_under: 9, percent: 55}
          - {age_under: 10, percent: 50}
    # ARF tiers as a percentage of OMV, used to estimate ARF when a listing does not show it.
    arf_tiers:
      - {omv_up_to: 20000, percent: 100}
      - {omv_up_to: 40000, percent: 140}
      - {omv_up_to: 60000, percent: 190}
      - {omv_up_to: 80000, percent: 250}
      - {omv_up_to: null, percent: 320}
  energy:
    ev:
      kwh_per_100km: 16
      home_price_per_kwh: 0.30
      public_price_per_kwh: 0.60
      home_share: 0.70
    ice:
      litres_per_100km: 8.0
      # Pump price per litre before discounts, seen on 22 September 2026.
      fallback_petrol_95_price: 3.48
      # Which brand price feeds the running cost: min (cheapest brand), median or avg across brands.
      # Median is the default because Cnergy is far cheaper but has only a handful of stations.
      # brand uses the brand named in price_brand when it was scraped, else falls back to median.
      price_pick: median
      price_brand: Cnergy
      # Brands expected on the comparison page. Missing ones are logged, extra ones are kept.
      brands: [SPC, Shell, Esso, Caltex, Sinopec, Cnergy]
      # A station the report always shows on its own line with public and member prices.
      preferred_station: Cnergy
      preferred_station_use_member_price: true
    hybrid:
      litres_per_100km: 5.5
  financing:
    verified_on: "2026-09-29"
    # MAS loan to value limits: 70 percent when OMV is 20,000 or less, else 60 percent.
    ltv_omv_threshold: 20000
    ltv_low_omv: 0.70
    ltv_high_omv: 0.60
    # When a listing does not show OMV, assume it is above the threshold (true for every EV on sale).
    assume_omv_above_threshold: true
    max_tenure_years: 7
    short_tenure_years: 5
    # Flat rates per annum quoted by the big three banks in September 2026. Bank rates change
    # monthly, so check MoneySmart or Singsaver before you sign.
    flat_rate_new: 0.0248
    flat_rate_used: 0.0278
  fixed_extras:
    servicing:
      ev: 800
      ice: 1200
      hybrid: 1200
    tyres: 300
    season_parking: 1200
    erp: 600

buying_considerations:
  verified_on: "2026-09-29"
  loan_rules: >
    Maximum loan is 70 percent of the purchase price when OMV is 20,000 or less, and 60 percent
    when OMV is above 20,000. Maximum tenure is 7 years. MAS rules, checked 2026-09-29.
  arf_parf: >
    ARF is the Additional Registration Fee paid when a car is first registered, tiered on OMV.
    PARF is the rebate you get back if the car is deregistered before it turns 10, as a
    percentage of ARF that falls with age. Cars registered before 13 February 2026 keep the old
    schedule of 75 percent down to 50 percent, capped at 60,000. Cars with COEs from the second
    February 2026 exercise get only 30 percent down to 5 percent, capped at 30,000. This makes a
    used car registered before February 2026 worth relatively more at the end of its COE than a
    new car bought today. A car past 10 years on a renewed COE has no PARF rebate at all.
  ev_incentives:
    - name: EV Early Adoption Incentive
      detail: >
        45 percent off ARF, capped at 7,500 for electric cars registered in 2026 (it was 15,000
        in 2025). Ends 31 December 2026 and is not being extended further.
      ends: "2026-12-31"
    - name: Vehicular Emissions Scheme
      detail: >
        From 2026 there is a single band A for electric cars only. Rebate 22,500 in 2026 and
        20,000 in 2027. Hybrids no longer receive any VES rebate. The ARF floor of zero for
        electric cars stays until 31 December 2027.
      ends: "2027-12-31"
  policy_watch:
    - "PARF rebate cut to 30 to 5 percent of ARF, capped at 30,000, for cars with COEs from 13 February 2026. Older cars keep the 75 to 50 percent schedule."
    - "EEAI ends 31 December 2026. An EV registered in 2026 gets up to 30,000 off ARF combined with VES, only 20,000 in 2027."
    - "LTA announces the COE quota for each three month period. Watch for the quota announcement in the month before each period."
    - "Road tax and ARF revisions are usually announced at the Budget in February and take effect within the year."
  rule_of_thumb: >
    When Cat A is above {cat_a_threshold} a used car with a long COE runway usually depreciates
    less per year than a new one. Compare the per year figures in the cost table rather than
    the sticker prices.
  cat_a_threshold_sgd: 90000
