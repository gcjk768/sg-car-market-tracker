<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG Car Market · COE, new EVs and used cars, priced daily</title>
<meta name="description" content="Singapore car market, every morning: COE results and forecast, every new car on the price list, every live used listing with real cost of ownership, top selling brands, bikes and pump prices.">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd400'/%3E%3Cpath d='M14 40l6-14h24l6 14v10h-6v-4H20v4h-6zM21 38h22l-3-8H24z' fill='%230d0d0b'/%3E%3Ccircle cx='22' cy='44' r='3' fill='%230d0d0b'/%3E%3Ccircle cx='42' cy='44' r='3' fill='%230d0d0b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* SG CAR MARKET . pit-board edition. Singapore number plate yellow on asphalt black or showroom paper.
   Layout: fixed side rail (desktop) / bottom tab bar (mobile), live COE ticker, bento Today, timing-tower COE. */
:root{
  --bg:#ece9e0; --bg-2:#e1ddd1; --card:#f9f7f1; --ink:#0d0d0b; --ink-2:#34322c; --mute:#6c685d;
  --line:rgba(13,13,11,.14); --line-2:rgba(13,13,11,.9);
  --plate:#ffd400; --plate-ink:#0d0d0b;
  --accent:#0d0d0b; --accent-ink:#ffd400; --accent-soft:rgba(255,212,0,.32);
  --good:#0a7d52; --good-soft:rgba(10,125,82,.13); --bad:#d3361a; --bad-soft:rgba(211,54,26,.13); --warn:#9a6400; --warn-soft:rgba(154,100,0,.14);
  --shot:#f4f3ee;
  --display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"Instrument Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --rail:244px;
}
[data-theme="dark"]{
  --bg:#0b0c0d; --bg-2:#141517; --card:#121315; --ink:#f1efe7; --ink-2:#c9c6bb; --mute:#8d8a80;
  --line:rgba(241,239,231,.12); --line-2:rgba(241,239,231,.8);
  --accent:#ffd400; --accent-ink:#0d0d0b; --accent-soft:rgba(255,212,0,.16);
  --good:#3ddc97; --good-soft:rgba(61,220,151,.14); --bad:#ff6b4a; --bad-soft:rgba(255,107,74,.15); --warn:#f0b429; --warn-soft:rgba(240,180,41,.15);
  --shot:#e9e8e2;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0c0d; --bg-2:#141517; --card:#121315; --ink:#f1efe7; --ink-2:#c9c6bb; --mute:#8d8a80;
  --line:rgba(241,239,231,.12); --line-2:rgba(241,239,231,.8);
  --accent:#ffd400; --accent-ink:#0d0d0b; --accent-soft:rgba(255,212,0,.16);
  --good:#3ddc97; --good-soft:rgba(61,220,151,.14); --bad:#ff6b4a; --bad-soft:rgba(255,107,74,.15); --warn:#f0b429; --warn-soft:rgba(240,180,41,.15);
  --shot:#e9e8e2;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;line-height:.95;text-transform:uppercase;letter-spacing:.005em}
h2{font-size:38px;font-weight:800}
h3{font-size:22px;font-weight:800}
p{margin:0}
.mute{color:var(--mute)} .small{font-size:13px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
[hidden]{display:none!important}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell: side rail ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:2px solid var(--ink);background:var(--bg);z-index:30;padding:22px 0 18px}
.brand{display:block;text-decoration:none;padding:0 22px 18px;border-bottom:2px solid var(--ink)}
.brand .mark{display:block;font:900 66px/.82 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.brand .mark i{font-style:normal;display:inline-block;background:var(--plate);color:var(--plate-ink);padding:0 8px;margin-left:-2px;transition:transform .4s var(--ease)}
.brand:hover .mark i{transform:translateX(6px) skewX(-8deg)}
.brand .tag{display:block;margin-top:10px;font:600 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
nav{display:flex;flex-direction:column;margin-top:8px;counter-reset:nv;flex:1;overflow:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{position:relative;counter-increment:nv;display:flex;align-items:baseline;gap:12px;padding:11px 22px;text-decoration:none;font:800 27px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--mute);transition:color .25s,padding .35s var(--ease)}
nav a::after{content:counter(nv,decimal-leading-zero);order:-1;font:500 11px var(--mono);letter-spacing:.06em;color:var(--mute);width:18px}
nav a::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--plate);transform:scaleY(0);transform-origin:50% 50%;transition:transform .35s var(--ease)}
nav a:hover{color:var(--ink);padding-left:30px}
nav a[aria-current="page"]{color:var(--ink);padding-left:30px}
nav a[aria-current="page"]::before{transform:scaleY(1)}
.nbadge{display:inline-block;min-width:20px;padding:0 6px;margin-left:auto;background:var(--ink);color:var(--bg);font:600 11px/20px var(--mono);text-align:center}
.railfoot{padding:14px 22px 0;border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:12px}
.fresh{display:flex;align-items:center;gap:8px;font:600 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.fresh::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--good);flex:none;animation:beat 2.4s ease-in-out infinite}
.fresh.stale::before{background:var(--warn);animation:none}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.theme{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;height:40px;padding:0 12px;border:2px solid var(--ink);background:transparent;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;overflow:hidden}
.theme span{position:relative;z-index:1;transition:color .3s}
.theme::before{content:"";position:absolute;top:0;bottom:0;left:0;width:50%;background:var(--plate);transform:translateX(100%);transition:transform .45s var(--ease)}
[data-theme="light"] .theme::before{transform:none}
html:not([data-theme]) .theme::before{transform:none}
@media (prefers-color-scheme:dark){html:not([data-theme]) .theme::before{transform:translateX(100%)}}
.theme .t-l,.theme .t-d{color:var(--ink)}
[data-theme="light"] .theme .t-l,html:not([data-theme]) .theme .t-l{color:var(--plate-ink)}
[data-theme="dark"] .theme .t-d{color:var(--plate-ink)}
@media (prefers-color-scheme:dark){html:not([data-theme]) .theme .t-l{color:var(--ink)}html:not([data-theme]) .theme .t-d{color:var(--plate-ink)}}
.theme:hover{background:var(--bg-2)}

/* ---------- ticker ---------- */
.ticker{position:relative;overflow:hidden;background:var(--plate);color:var(--plate-ink);border-bottom:2px solid var(--ink);height:44px;display:flex;align-items:center}
.ticker .belt{display:flex;flex:none;white-space:nowrap;animation:belt 46s linear infinite;will-change:transform}
.ticker:hover .belt{animation-play-state:paused}
.ticker .it{display:inline-flex;align-items:baseline;gap:9px;padding:0 26px;border-right:2px solid var(--plate-ink);font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.ticker .it b{font:900 25px/1 var(--display);letter-spacing:.01em}
.ticker .it .dn{color:#05603c} .ticker .it .up{color:#a8210c}
@keyframes belt{to{transform:translateX(-50%)}}

/* ---------- content column ---------- */
.stage{min-width:0}
main{padding:0 clamp(18px,3.2vw,52px) 80px}
.view{display:none}
.view.on{display:block}
.entering .rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.pop-in{animation:popin .5s var(--ease) both}
@keyframes popin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#sweep{position:fixed;left:0;right:0;top:0;height:6px;background:var(--plate);z-index:80;transform:scaleX(0);transform-origin:0 50%;pointer-events:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 40px;flex-wrap:wrap;margin:44px 0 20px;padding-top:18px;border-top:2px solid var(--ink)}
.head>div{min-width:0;max-width:78ch}
.head p{margin-top:10px;color:var(--ink-2);max-width:68ch}
.head h2::before{content:"";display:inline-block;width:.34em;height:.34em;background:var(--plate);margin-right:.2em;vertical-align:.06em;outline:2px solid var(--ink);outline-offset:-2px}
.view>.head:first-child{margin-top:34px;border-top:0;padding-top:0}
.view>.head:first-child h2{font-size:clamp(64px,10vw,150px);font-weight:900;line-height:.84;letter-spacing:-.005em}
.view>.head:first-child h2::before{display:none}
.view>.head:first-child p{font-size:16px}
section+section{margin-top:12px}

/* shared bits */
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;font:600 11.5px/1.7 var(--mono);letter-spacing:.02em;white-space:nowrap;text-transform:uppercase}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.flat{background:var(--bg-2);color:var(--ink-2)}
.chip.acc{background:var(--plate);color:var(--plate-ink)}
.chip.ink{background:var(--ink);color:var(--bg)}
.note{font-size:13px;color:var(--mute);line-height:1.55}
details.note summary{cursor:pointer;color:var(--ink);font-weight:600}
.links a,.srcs a{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-bottom:2px solid var(--plate);padding-bottom:1px;transition:background .2s}
.links a:hover,.srcs a:hover{background:var(--plate);color:var(--plate-ink)}
.links a+a{margin-left:16px}
.how{appearance:none;background:none;border:0;padding:0;text-align:left;color:inherit;position:relative;display:inline-block;align-self:flex-start;cursor:help}
.how::after{content:"?";position:absolute;top:2px;right:-4px;transform:translateX(100%);width:19px;height:19px;border:1.5px solid currentColor;border-radius:50%;font:600 11px/16px var(--mono);text-align:center;opacity:.5;transition:opacity .2s,transform .3s var(--ease)}
.how:hover::after{opacity:1;transform:translateX(100%) rotate(20deg)}
.empty{padding:44px 20px;text-align:center;color:var(--mute);border:2px dashed var(--line);font-family:var(--mono);font-size:13px}

/* ---------- ledger rows: used for drops, news, deals ---------- */
.drops{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));border-top:1px solid var(--line-2);border-left:1px solid var(--line)}
.drop{position:relative;min-width:0;padding:16px 18px 16px 20px;text-decoration:none;display:flex;flex-direction:column;gap:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;transition:background .25s}
.drop::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--plate);transform:scaleY(0);transform-origin:50% 100%;transition:transform .4s var(--ease)}
.drop:hover{background:var(--card)}
.drop:hover::before{transform:scaleY(1)}
.drop b{font:800 20px/1.05 var(--display);text-transform:uppercase}
.drop .chip{align-self:flex-start}
.drop .num{font-size:15px;font-weight:600}

/* ---------- Today: bento ---------- */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-top:26px}
.hero-coe{container-type:inline-size;grid-column:span 8;grid-row:span 2;background:#0e0e0c;color:#f2efe6;padding:26px 30px 24px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;border:2px solid var(--ink);min-height:470px}
.hero-coe::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;background:repeating-linear-gradient(135deg,var(--plate) 0 14px,transparent 14px 28px);opacity:.16;pointer-events:none}
.hero-coe .label{font:600 12px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#c2bfb2}
.hero-coe .bigrow{display:flex;align-items:flex-end;gap:10px 28px;flex-wrap:wrap;margin-top:6px}
.hero-coe .big{display:block;font:900 clamp(64px,29cqw,236px)/.8 var(--display);letter-spacing:-.015em;color:var(--plate);font-variant-numeric:tabular-nums;white-space:nowrap}
.hero-coe .big .cur{font-size:.36em;vertical-align:.95em;margin-right:.06em;opacity:.8}
.hero-coe .side{padding-bottom:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hero-coe .chip{font-size:14px;padding:3px 11px}
.hero-coe .chip.good{background:rgba(61,220,151,.18);color:#3ddc97}
.hero-coe .chip.bad{background:rgba(255,107,74,.18);color:#ff6b4a}
.hero-coe .chip.flat{background:rgba(255,255,255,.1);color:#d9d6cb}
.hero-coe .miss{font:500 12.5px var(--mono);color:#c2bfb2}
.hero-coe .chart{position:relative;margin-top:auto;height:132px;transform-origin:0 50%}
.hero-coe .chart svg{width:100%;height:100%;display:block;color:var(--plate)}
.entering .hero-coe .chart{animation:drawx 1.3s var(--ease) both .25s}
@keyframes drawx{from{transform:scaleX(0);opacity:.2}to{transform:none;opacity:1}}
.hero-coe .foot{display:flex;gap:6px 26px;flex-wrap:wrap;font:500 12.5px var(--mono);color:#c2bfb2;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.hero-coe .foot b{color:#f2efe6}
.tile{grid-column:span 4;background:var(--card);border:2px solid var(--ink);padding:16px 20px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:150px;position:relative;overflow:hidden;transition:transform .35s var(--ease),background .25s}
.tile:hover{transform:translate(-4px,-4px);background:var(--bg)}
.tile::after{content:"";position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 24px 24px;border-color:transparent transparent var(--plate) transparent;transition:border-width .3s var(--ease)}
.tile:hover::after{border-width:0 0 46px 46px}
.tile .v{white-space:nowrap;font:900 clamp(60px,7vw,104px)/.82 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .k{font-size:13px;color:var(--ink-2);line-height:1.4;max-width:30ch}
.tile .k a{font:600 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-bottom:2px solid var(--plate)}
.tile.warm{background:var(--plate);color:var(--plate-ink)}
.tile.warm .k{color:var(--plate-ink)} .tile.warm::after{border-bottom-color:var(--ink)}
.tile.warm:hover{background:var(--plate)}
.tile.half{grid-column:span 6}

/* ---------- COE timing tower ---------- */
.tower{border-top:2px solid var(--ink)}
.coe{display:grid;grid-template-columns:150px minmax(150px,1.1fr) minmax(130px,1fr) minmax(180px,1.2fr) minmax(170px,1fr);gap:8px 22px;align-items:center;padding:16px 4px 16px 0;border-bottom:1px solid var(--line);position:relative;transition:background .25s,padding .35s var(--ease)}
.coe:hover{background:var(--card);padding-left:12px}
.coe .cat{display:flex;flex-direction:column;gap:3px}
.coe .cat b{font:900 64px/.8 var(--display)}
.coe .cat .small{font:500 11px/1.3 var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.05em;text-align:left}
.coe .prem{display:inline-block;white-space:nowrap;font:900 clamp(44px,5vw,66px)/.85 var(--display);font-variant-numeric:tabular-nums}
.coe .prem small{font-size:.5em;vertical-align:.7em;opacity:.55;margin-right:2px}
.coe .sp{height:48px}
.coe svg{width:100%;height:100%;display:block;color:var(--ink)}
.coe .sp svg{transform-origin:0 50%}
.coe .dem{font:500 12px var(--mono);color:var(--ink-2)}
.coe .dem .meter{height:9px;background:var(--bg-2);margin:7px 0 6px;position:relative;overflow:hidden}
.coe .dem .meter i{position:absolute;inset:0;background:var(--ink);transform:scaleX(var(--w,.5));transform-origin:0 50%;transition:transform .9s var(--ease)}
.coe .dem .meter i.over{background:var(--bad)}
.coe .fc{font:500 12.5px/1.45 var(--mono);color:var(--ink-2)}
.coe .fc b{font-weight:600;color:var(--ink)}
.coe .dl{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
@media (max-width:1180px){.coe{grid-template-columns:110px 1fr}.coe .sp,.coe .dem,.coe .fc{grid-column:1/-1}}

.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:2px solid var(--ink)}
.pick{padding:22px 24px 20px;border-right:2px solid var(--ink);display:flex;flex-direction:column;gap:8px;position:relative;background:var(--card);transition:background .3s}
.pick:last-child{border-right:0}
.pick:hover{background:var(--bg)}
.pick .lab{font:600 11.5px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pick .nm{font:800 25px/1 var(--display);text-transform:uppercase}
.pick .nm a{text-decoration:none;background:linear-gradient(var(--plate),var(--plate)) 0 100%/0 .28em no-repeat;transition:background-size .4s var(--ease)}
.pick .nm a:hover{background-size:100% .28em}
.pick .v{white-space:nowrap;font:900 clamp(58px,6vw,92px)/.85 var(--display);font-variant-numeric:tabular-nums;margin-top:6px}
.pick .v small{display:block;font:500 12px var(--mono);color:var(--mute);margin-top:8px;letter-spacing:.02em}
.pick.low{background:var(--plate);color:var(--plate-ink)}
.pick.low .lab,.pick.low .v small{color:var(--plate-ink)}
.pick.low .good{color:#05603c}
.pick.low:hover{background:var(--plate)}
.pick dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0;font:500 12.5px var(--mono);border-top:1px solid currentColor;padding-top:10px}
.pick dt{opacity:.6} .pick dd{margin:0;text-align:right}

.fuel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.fuel>div{min-width:0;overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:2px solid var(--ink)}
table.t th,table.t td{padding:10px 12px;text-align:right;font-family:var(--mono)}
table.t th{font:600 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--bg);background:var(--ink)}
table.t th:first-child,table.t td:first-child{text-align:left;font-family:var(--body);font-weight:600}
table.t tr+tr td{border-top:1px solid var(--line)}
table.t td.min{color:var(--good);font-weight:700;background:var(--good-soft)}
table.t tbody tr{transition:background .2s}

/* ---------- filter bar: the control deck ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 calc(-1*clamp(18px,3.2vw,52px));padding:12px clamp(18px,3.2vw,52px);border-bottom:2px solid var(--ink);border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line-2);align-self:flex-start;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chips button{position:relative;border:0;border-right:1px solid var(--line-2);background:transparent;padding:7px 14px;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;display:inline-flex;gap:8px;align-items:center;overflow:hidden;transition:color .25s}
.chips button:last-child{border-right:0}
.chips button span{font-weight:500;color:var(--mute);font-size:11px}
.chips button::before,.seg button::before,.vpill::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .35s var(--ease);z-index:-1}
.chips button>*,.seg button>*{position:relative;z-index:1}
.chips button[aria-pressed="true"],.seg button[aria-pressed="true"]{color:var(--bg)}
.chips button[aria-pressed="true"]::before,.seg button[aria-pressed="true"]::before{transform:none}
.chips button[aria-pressed="true"] span{color:inherit;opacity:.7}
.chips button:hover:not([aria-pressed="true"])::before{transform:translateY(88%)}
.chips button,.seg button{isolation:isolate}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrls select,.ctrls input{border:1px solid var(--line-2);background:var(--card);padding:8px 10px;font:500 13px var(--mono);min-width:0;border-radius:0}
.ctrls select:hover,.ctrls input:hover{background:var(--bg-2)}
.ctrls input[type=search]{flex:1 1 240px}
.toggle{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{accent-color:var(--ink);width:17px;height:17px}
.seg{display:inline-flex;border:1px solid var(--line-2);margin-left:auto}
.seg button{position:relative;border:0;border-right:1px solid var(--line-2);background:transparent;padding:8px 14px;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;transition:color .25s}
.seg button:last-child{border-right:0}
.seg.kind{margin-left:0;border-width:2px}
.seg.kind button{padding:9px 24px;font:900 22px/1 var(--display);letter-spacing:.04em}
.seg.kind button span{font:500 11px var(--mono);opacity:.6;margin-left:6px;letter-spacing:0}
.kindrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.count{font:500 12.5px var(--mono);color:var(--ink-2);margin:20px 0 14px;text-transform:uppercase;letter-spacing:.06em}
.count b{font:900 30px/1 var(--display);letter-spacing:0;color:var(--ink);margin:0 2px}

/* ---------- car cards: showroom plates ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:22px 18px}
.car{min-width:0;background:var(--card);border:1px solid var(--line-2);display:flex;flex-direction:column;gap:12px;position:relative;padding:0 0 14px;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.car:hover{transform:translateY(-6px);box-shadow:0 6px 0 var(--plate),0 7px 0 var(--ink)}
.car.off{opacity:.74}
.car>*:not(.shot):not(.star){margin-left:16px;margin-right:16px}
.car .shot{display:block;aspect-ratio:16/10;background:radial-gradient(120% 90% at 50% 100%,#fff,var(--shot));overflow:hidden;border-bottom:1px solid var(--line-2);position:relative}
.car .shot img{width:100%;height:100%;object-fit:contain;display:block;padding:6%;transition:transform .7s var(--ease)}
.car:hover .shot img{transform:scale(1.08) translateX(3%)}
.car .shot::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--plate);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease)}
.car:hover .shot::after{transform:none}
.car .top-row{display:flex;flex-direction:column;gap:8px;padding-top:2px}
.car:not(:has(.shot)) .top-row{padding-top:16px}
.car h3{font-size:26px;line-height:.95;padding-right:34px}
.car h3 a{text-decoration:none}
.car h3 a:hover{background:var(--plate);color:var(--plate-ink)}
.car .sub{font:500 11.5px/1.4 var(--mono);color:var(--mute);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
.car .badges{display:flex;gap:5px;flex-wrap:wrap}
.car .v360{text-decoration:none}
.car .v360:hover{box-shadow:inset 0 -2px 0 var(--ink)}
.car .price{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.car .price .p{font:900 54px/.85 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.005em;position:relative}
.car .price .p small{font:500 12px var(--mono);color:var(--mute);margin-left:4px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.specs div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.specs span{color:var(--mute);font:500 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em}
.specs b{font:600 14px var(--mono)}
.car .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 11.5px var(--mono);color:var(--mute);padding-top:2px;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.04em}
.car .foot a{font-weight:700;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--plate)}
.car .foot a:hover{background:var(--plate);color:var(--plate-ink)}
.variants{margin:0;padding:0;list-style:none}
.promo{font:500 12px var(--mono);color:var(--plate-ink);background:var(--plate);padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{height:40px}
.spark svg{width:100%;height:100%;display:block}
.reason{font:600 11.5px var(--mono);color:var(--warn);text-transform:uppercase;letter-spacing:.04em}
details.vlist summary{cursor:pointer;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;list-style:none}
details.vlist summary::-webkit-details-marker{display:none}
details.vlist summary::after{content:" +"} details.vlist[open] summary::after{content:" \2212"}
.flags{margin:0;padding:8px 10px 8px 28px;background:var(--warn-soft);color:var(--warn);font:600 12px/1.45 var(--mono)}
.flags li::marker{content:"\26A0  "}
.vpills{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2)}
.vpill{position:relative;border:0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);background:transparent;padding:6px 9px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;text-align:left;overflow:hidden;isolation:isolate;transition:color .25s}
.vpill>*{position:relative;z-index:1}
.vpill .vn{font:600 11.5px var(--body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vpill .vp{font:500 11.5px var(--mono);color:var(--mute)}
.vpill[aria-pressed="true"]{color:var(--bg)}
.vpill[aria-pressed="true"] .vp{color:inherit;opacity:.75}
.vpill[aria-pressed="true"]::before{transform:none}
.vpill:hover:not([aria-pressed="true"])::before{transform:translateY(90%)}
.tbl{overflow-x:auto}
table.list td{vertical-align:top;white-space:nowrap}
table.list td:first-child{white-space:normal;min-width:200px}
table.list td a{text-decoration:none;font-weight:700}
table.list tr.off td{opacity:.7}
table.list tbody tr:hover td{background:var(--accent-soft)}
.mcell{display:flex;align-items:center;gap:10px;text-align:left}
.thumb{width:76px;flex:none;aspect-ratio:3/2;object-fit:contain;background:#fff}

/* ---------- brands: leaderboard ---------- */
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:36px;align-items:start}
.two h3{font-size:34px;margin-bottom:12px}
.rank{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.rk{display:grid;grid-template-columns:54px 1fr auto;gap:4px 12px;align-items:center;padding:12px 4px 12px 0;border-bottom:1px solid var(--line);transition:background .25s,padding .35s var(--ease)}
.rk:hover{background:var(--card);padding-left:10px}
.rk .n{font:900 40px/.85 var(--display);color:var(--mute)}
.rk:nth-child(-n+3) .n{color:var(--ink)}
.rk .mk{font:800 24px/1 var(--display);text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rk .bar-s{height:8px;background:var(--bg-2);grid-column:2/4;overflow:hidden;position:relative}
.rk .bar-s i{position:absolute;inset:0;background:var(--ink);transform:scaleX(var(--w,.5));transform-origin:0 50%;transition:transform 1s var(--ease)}
.rk:nth-child(-n+3) .bar-s i{background:var(--plate);outline:1px solid var(--ink);outline-offset:-1px}
.rk .regs{font:500 12.5px var(--mono);color:var(--ink-2);text-align:right}
.rk .models{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.rk .models span{font:500 12px var(--mono);border:1px solid var(--line-2);padding:2px 8px;display:inline-flex;gap:6px}
.rk .models span b{font-weight:700}
.rk .models span.np{color:var(--mute);border-style:dashed;border-color:var(--line)}

/* ---------- costs / guide ---------- */
.cost-table{overflow-x:auto}
table.costs th{vertical-align:top;text-transform:none;letter-spacing:0;min-width:210px;font-family:var(--body)}
table.costs th:first-child{min-width:150px}
table.costs tr.sect td{background:var(--plate);font:700 12px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--plate-ink);text-align:left}
table.costs tr.sect td span{text-transform:none;letter-spacing:0;font-weight:500;margin-left:8px}
.costpick{width:100%;max-width:290px;border:1px solid var(--bg);background:var(--bg);color:var(--ink);padding:8px;font:600 13px var(--body);border-radius:0}
.pickmeta{margin-top:8px;font:500 11.5px/1.45 var(--mono);color:var(--bg);opacity:.75;text-align:left}
.pickmeta a{color:var(--bg);font-weight:700;border-bottom:2px solid var(--plate)}
.cost-table tr.total td{font-weight:700;background:var(--accent-soft)}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px solid var(--ink)}
.g{padding:22px 24px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);background:var(--card);transition:background .25s}
.g:hover{background:var(--bg)}
.g p,.g li{font-size:14px;color:var(--ink-2);line-height:1.6}
.g ul{margin:0;padding-left:18px}
.g.wide{grid-column:1/-1}
.g ul.alist{list-style:none;margin:0;padding:0;font-size:13.5px}
.alist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.alist li>a,.alist li>span:first-child{flex:1;min-width:0;overflow-wrap:anywhere;text-decoration:none;font-weight:600;color:var(--ink)}
.alist .r{display:flex;gap:6px;align-items:center;font-family:var(--mono);white-space:nowrap}
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:0;align-items:start;border:2px solid var(--ink)}
footer{border-top:2px solid var(--ink);padding:22px clamp(18px,3.2vw,52px) 40px;font:500 11.5px/1.6 var(--mono);color:var(--mute);display:flex;justify-content:space-between;gap:12px 40px;flex-wrap:wrap}
#loading{padding:120px 20px;text-align:center;color:var(--mute);font:500 13px var(--mono);text-transform:uppercase;letter-spacing:.1em}
.skel{height:22px;background:linear-gradient(90deg,var(--bg-2),var(--plate),var(--bg-2));background-size:200% 100%;animation:sh 1.1s linear infinite;margin:12px auto;max-width:420px}
@keyframes sh{to{background-position:-200% 0}}

/* watchlist */
.star{border:1.5px solid var(--ink);background:var(--card);color:var(--mute);width:34px;height:34px;display:inline-grid;place-items:center;flex:none;font-size:17px;line-height:1;padding:0;transition:transform .3s var(--ease),background .2s}
.star::before{content:"\2606"}
.star:hover{transform:rotate(18deg) scale(1.12);background:var(--plate);color:var(--plate-ink)}
.star[aria-pressed="true"]{color:var(--plate-ink);background:var(--plate)}
.star[aria-pressed="true"]::before{content:"\2605"}
.star.sm{width:28px;height:28px;font-size:14px}
.car>.star{position:absolute;top:12px;right:12px;z-index:2}
.car .shot~.star{background:#fff;color:#444}
.car.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,40%{outline:4px solid var(--plate);outline-offset:3px}100%{outline:4px solid transparent;outline-offset:3px}}
.witem{position:relative;padding-right:56px}
.witem>.star{position:absolute;top:12px;right:12px}
.witem a{text-decoration:none}

/* how it is computed */
dialog#howd{border:2px solid var(--ink);background:var(--bg);color:var(--ink);padding:0;max-width:min(560px,92vw);width:100%;box-shadow:12px 12px 0 var(--plate)}
dialog#howd::backdrop{background:rgba(5,5,4,.62)}
dialog#howd[open]{animation:popin .4s var(--ease)}
dialog#howd .hd{background:var(--ink);color:var(--bg);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
dialog#howd .hd h3{font-size:32px;color:var(--plate)}
dialog#howd .bd{padding:18px 22px 22px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.6;color:var(--ink-2)}
dialog#howd .bd .eq{font:500 13px/1.6 var(--mono);background:var(--card);border-left:6px solid var(--plate);padding:10px 14px;color:var(--ink)}
dialog#howd .bd ul{margin:0;padding-left:18px}
dialog#howd button{border:2px solid var(--bg);background:transparent;color:var(--bg);width:34px;height:34px;font:700 16px var(--mono);flex:none}
dialog#howd button:hover{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}

/* ---------- laptop and tablet ---------- */
@media (max-width:1100px){
  .hero-coe{grid-column:span 12;grid-row:auto;min-height:400px}
  .tile{grid-column:span 6}
}
@media (max-width:980px){
  .picks{grid-template-columns:1fr}
  .pick{border-right:0;border-bottom:2px solid var(--ink)} .pick:last-child{border-bottom:0}
  .two,.fuel{grid-template-columns:1fr}
  .guide{grid-template-columns:1fr}
}

/* ---------- phone: rail becomes a top strip plus a bottom tab bar. Restated AFTER the desktop rules above. ---------- */
@media (max-width:860px){
  .shell{display:block}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;justify-content:space-between;border-right:0;border-bottom:2px solid var(--ink);padding:10px 16px;gap:12px}
  .brand{padding:0;border:0;display:flex;align-items:center;gap:12px}
  .brand .mark{font-size:34px;line-height:.9}
  .brand .tag{display:none}
  .railfoot{flex-direction:row;align-items:center;border:0;padding:0;gap:10px}
  .theme{width:auto;min-width:112px;height:34px}
  .fresh{font-size:10px;max-width:92px;line-height:1.2}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:60;flex-direction:row;margin:0;flex:none;background:var(--bg);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);overflow-x:auto}
  nav a{flex:1 0 auto;min-width:64px;justify-content:center;padding:11px 12px 10px;font-size:19px;gap:0;flex-direction:column;align-items:center}
  nav a::after{display:none}
  nav a::before{top:0;bottom:auto;left:0;right:0;width:auto;height:5px;transform:scaleX(0)}
  nav a:hover,nav a[aria-current="page"]{padding-left:12px}
  nav a[aria-current="page"]::before{transform:scaleX(1)}
  .nbadge{position:absolute;top:6px;right:4px;margin:0}
  .ticker{height:38px}
  main{padding-bottom:96px}
  .view>.head:first-child h2{font-size:clamp(54px,17vw,96px)}
  .head{margin-top:34px}
  .bento{gap:8px}
  .hero-coe{padding:18px 18px 16px;min-height:340px}
  .hero-coe .big{font-size:clamp(64px,29cqw,150px)}
  .hero-coe .chart{height:96px}
  .tile{grid-column:span 6;min-height:128px;padding:12px 14px}
  .tile .v{font-size:clamp(46px,15vw,74px)}
  .coe{grid-template-columns:84px 1fr;gap:6px 14px}
  .tile,.tile.half{grid-column:span 6}
  .coe .cat b{font-size:52px}
  .coe .prem{font-size:52px}
  .grid{grid-template-columns:1fr}
  .car .price .p{font-size:48px}
  .seg.kind button{padding:8px 16px;font-size:20px}
  .bar{position:static;padding-top:8px;padding-bottom:8px}
  .ctrls select{flex:1 1 44%}
  .seg{margin-left:0}
  .rk{grid-template-columns:44px 1fr auto}
  .specs{grid-template-columns:repeat(2,1fr)}
  table.t th,table.t td{padding:8px 7px}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ticker .belt{animation:none!important}
  .ticker{overflow-x:auto}
  #sweep{display:none}
}

.entering .coe .meter i,.entering .rk .bar-s i{animation:grow 1.1s var(--ease) both .3s}
.entering .coe .sp svg{animation:grow 1.1s var(--ease) both .3s}
@keyframes grow{from{transform:scaleX(0)}}
</style>
</head>
<body>
<div id="sweep" aria-hidden="true"></div>
<div class="shell">

  <a class="brand" href="#today" aria-label="SG Car Market, home">

    <span class="tag">Singapore COE and car prices, every morning</span>
  </a>
  <nav aria-label="Sections">
    <a href="#today">Today<span class="nbadge" id="nbadge" hidden></span></a><a href="#new">New cars</a><a href="#used">Used cars</a><a href="#brands">Brands</a><a href="#bikes">Bikes</a><a href="#costs">Costs</a><a href="#guide">Guide</a>
  </nav>
  <div class="railfoot">
    <div class="fresh" id="stamp">loading</div>
    <button class="theme" id="theme" type="button" aria-label="Switch light or dark theme" title="Light or dark"><span class="t-l">Light</span><span class="t-d">Dark</span></button>

  <div id="brands" class="view"></div>

</main>
<footer><span id="foot-l"></span><span>Prices from Sgcarmart and Motorist, COE from Motorist and LTA via data.gov.sg, registrations from LTA, bikes from SGBikemart, pump prices from Motorist.</span></footer>
</div>
</div>
<dialog id="howd" aria-labelledby="how-t"><div class="hd"><h3 id="how-t"></h3><button type="button" id="how-x" aria-label="Close">&#10005;</button></div><div class="bd" id="how-b"></div></dialog>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (v, d = "$") => v == null ? "n/a" : d + Math.round(v).toLocaleString("en-SG");
const k = v => v == null ? "n/a" : "$" + (Math.round(v / 1000)) + "k";
const int = v => v == null ? "n/a" : Math.round(v).toLocaleString("en-SG");
const dmy = s => { if (!s) return ""; const d = new Date(s); return d.toLocaleDateString("en-SG", {weekday: "short", day: "numeric", month: "short"}); };
const dmyy = s => { if (!s) return ""; const d = new Date(s); return d.toLocaleDateString("en-SG", {day: "numeric", month: "short", year: "numeric"}); };
const BODY_ORDER = ["SUV", "Sedan", "Hatchback", "MPV", "Coupe", "Wagon", "Other"];
const BODY_LABEL = {SUV: "SUV and crossover", Sedan: "Sedan", Hatchback: "Hatchback", MPV: "MPV", Coupe: "Coupe", Wagon: "Wagon", Other: "Other"};
const BUDGETS = [["", "Any budget"], ["0-100000", "Under $100k"], ["100000-150000", "$100k to $150k"], ["150000-200000", "$150k to $200k"], ["200000-300000", "$200k to $300k"], ["300000-", "$300k and up"]];
const DT = {ev: "Electric", hybrid: "Hybrid", ice: "Petrol"};
let D = null;
const state = {
  new: {kind: "ev", fuel: "", body: "", budget: "", cat: "", make: "", q: "", sort: "popular", layout: "cards"},
  newSel: {},
  costs: {sel: null, per: "year"},
  used: {kind: "ev", dt: "", body: "", budget: "", make: "", km: "", coe: "", owners: "", shortlist: true, q: "", sort: "best", src: "", layout: "cards"},
  bikes: {cls: "2B"},
};

/* theme */
const themeBtn = $("#theme");
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(localStorage.getItem("theme") || "");
themeBtn.addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  localStorage.setItem("theme", next); applyTheme(next);
});

/* sparkline: polyline with a baseline, last point marked */
function spark(points, {w = 200, h = 44, stroke = "currentColor", fill = false} = {}) {
  if (!points || points.length < 2) return "";
  const vals = points.map(p => p.v), min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const x = i => (i / (points.length - 1)) * (w - 8) + 4, y = v => h - 6 - ((v - min) / span) * (h - 12);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const last = points[points.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${fill ? `<path d="${d} L${(w - 4).toFixed(1)},${h} L4,${h} Z" fill="${stroke}" opacity=".1"/>` : ""}
    <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(points.length - 1).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3.5" fill="${stroke}"/></svg>`;
}
const delta = (d, pct) => d == null ? `<span class="chip flat">first tender</span>`

const finLine = f => f && f.deposit ? `<div><span>Deposit</span><b>${money(f.deposit)}</b></div><div><span>Monthly, ${f.tenure}y</span><b>${money(f.monthly)}</b></div>` : "";
const span = a => k(a.total_low) === k(a.total_high) ? k(a.total_low) : `${k(a.total_low)} to ${k(a.total_high)}`;
const annualLine = a => a ? `<div><span>Cost a year</span><b>${span(a)}</b></div>` : "";
const badge = (txt, cls = "flat") => `<span class="chip ${cls}">${esc(txt)}</span>`;
const opt = (list, cur, all) => `<option value="">${all}</option>` + list.map(v => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
const inBudget = (p, b) => { if (!b || p == null) return true; const [lo, hi] = b.split("-").map(Number); return p >= (lo || 0) && (!hi || p < hi); };

/* alerts:begin. Watchlist and "since your last visit". Pure functions without the DOM; tests/test_site_alerts.py runs them in node.
   Card ids like "new-0" are positions in one build, so nothing here uses them. A used listing keys on its id,
   "source-listing_id", which is the same every build; a new car on make|model|variant; a watched new car on make|model. */
const ALERT_CAP = 6;
const newKey = v => v.make + "|" + v.model + "|" + (v.variant || "");
// A compact copy of one build's prices, kept in localStorage to compare against on the next visit.
function snapOf(d) {
  const nw = {}, used = {}, coe = {};
  for (const v of d.new_evs.concat(d.new_cars || [])) if (v.price != null) { const key = newKey(v); nw[key] = Math.min(nw[key] ?? v.price, v.price); }
  for (const u of d.used) used[u.id] = u.price;
  for (const r of d.coe?.rows || []) coe[r.cat] = r.premium;
  return {at: d.generated_at, used, new: nw, coe, news: (d.news || []).map(n => n.link)};
}
const modelOf = key => key.slice(0, key.lastIndexOf("|"));
// A new visit is a build the browser has not seen yet: the last snapshot becomes "prev". Reloading the same build keeps "prev".
// The daily new EV scrape skips some models for a day, so a new model missing from this build keeps its last prices in "held"
// for one build. Only a model missing from two builds in a row counts as gone.
function nextSnaps(stored, cur) {
  if (stored && stored.cur && stored.cur.at === cur.at) return {prev: stored.prev || null, cur: {...cur, held: stored.cur.held || {}}};
  const last = stored?.cur, here = new Set(Object.keys(cur.new).map(modelOf)), held = {};
  for (const [key, p] of Object.entries(last?.new || {})) if (!here.has(modelOf(key))) held[key] = p;
  return {prev: last || null, cur: {...cur, held}};
}
// A stored snapshot from an older page version or a damaged localStorage is ignored rather than compared against.
const okSnap = s => s && typeof s.at === "string" && [s.used, s.new, s.coe].every(o => o && typeof o === "object") && Array.isArray(s.news) ? s : null;
// A watched car's price in a snapshot: the asking price of a used listing, the cheapest variant of a new model (held prices count), null when gone.
function priceIn(snap, wkey) {
  const i = wkey.indexOf(":"), kind = wkey.slice(0, i), id = wkey.slice(i + 1);
  if (kind === "used") return snap.used[id] ?? null;
  let low = null;
  for (const [key, p] of Object.entries({...snap.held, ...snap.new})) if (key.startsWith(id + "|") && (low == null || p < low)) low = p;
  return low;
}
// Everything that moved between two builds. Used price moves cover the shortlist and watched cars; the count drives the nav badge.
function changes(prev, cur, d, watch) {
  if (!prev) return null;
  const watched = id => ("used:" + id) in watch;
  const fresh = d.used.filter(u => u.passes && !(u.id in prev.used));
  const moved = d.used.filter(u => (u.passes || watched(u.id)) && u.id in prev.used && prev.used[u.id] !== u.price)
    .map(u => ({u, was: prev.used[u.id], d: u.price - prev.used[u.id]})).sort((x, y) => x.d - y.d);
  const newMoves = Object.entries(cur.new).filter(([key, p]) => key in prev.new && prev.new[key] !== p)
    .map(([key, p]) => ({key, was: prev.new[key], now: p, d: p - prev.new[key]})).sort((x, y) => x.d - y.d);
  const coe = Object.entries(cur.coe).filter(([c, p]) => c in prev.coe && prev.coe[c] != null && p != null && prev.coe[c] !== p)
    .map(([cat, p]) => ({cat, was: prev.coe[cat], now: p, d: p - prev.coe[cat]}));
  const news = (d.news || []).filter(n => !prev.news.includes(n.link));
  const gone = Object.keys(watch).filter(w => priceIn(prev, w) != null && priceIn(cur, w) == null);
  const out = {fresh, drops: moved.filter(m => m.d < 0), rises: moved.filter(m => m.d > 0), newMoves, coe, news, gone};
  out.count = Object.values(out).reduce((n, l) => n + l.length, 0);
  return out;
}
// Price move for the buyer: a drop is good (green), a rise is bad (red).
const pchip = d => d < 0 ? `<span class="chip good">▼ ${money(-d)}</span>` : d > 0 ? `<span class="chip bad">▲ ${money(d)}</span>` : `<span class="chip flat">unchanged</span>`;
// The filters goTo() applies so a car's card shows: everything that could hide it cleared, its make picked, cards layout.
function filtersFor(kind, car) {
  if (kind === "used") return {kind: car.drivetrain === "ev" ? "ev" : "ice", dt: "", body: "", budget: "", make: car.make, km: "", coe: "", owners: "", shortlist: false, q: "", src: "", layout: "cards"};
  return {kind: car.fuel === "ev" ? "ev" : "ice", fuel: "", body: "", budget: "", cat: "", make: car.make, q: "", layout: "cards"};
}

const star = (wkey, name, url, sm = false) => `<button type="button" class="star${sm ? " sm" : ""}" data-star="${esc(wkey)}" data-name="${esc(name)}" data-url="${esc(url)}" aria-pressed="${wkey in WATCH}" aria-label="Watch ${esc(name)}" title="Watchlist"></button>`;
const goLink = (wkey, label) => `<a href="#${wkey.slice(0, wkey.indexOf(":"))}" data-go="${esc(wkey)}">${esc(label)}</a>`;
function navCount() {

// Opens a car's card: clears the filters that could hide it, then the hash change renders the page and show() scrolls to it.
function goTo(wkey) {
  const i = wkey.indexOf(":"), kind = wkey.slice(0, i), id = wkey.slice(i + 1);
  if (kind === "used") {
    const u = D.used.find(x => x.id === id); if (!u) return;
    Object.assign(state.used, filtersFor("used", u));
  } else {
    const v = allNew().find(x => keyOf(x) === id); if (!v) return;
    Object.assign(state.new, filtersFor("new", v));
  }
  FOCUS = wkey; current = "";
}
function alertsView() {
  const watch = Object.entries(WATCH).map(([wkey, w]) => {

  const lists = ch ? [

    list("New car prices", ch.newMoves.map(m => { const [mk, md, vr] = m.key.split("|"); return `<li>${goLink(`new:${mk}|${md}`, `${mk} ${md} ${vr}`)}<span class="r">${money(m.now)} ${pchip(m.d)}</span></li>`; })),

    list("News", ch.news.map(n => `<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><span class="r small mute">${dmy(n.published)}</span></li>`)),
    list("Watched cars gone", ch.gone.map(w => `<li><span>${esc(WATCH[w].name)}</span><span class="r"><span class="chip warn">gone</span></span></li>`)),
  ].join("") : "";
  const when = PREV ? new Date(PREV.at).toLocaleString("en-SG", {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "";
  return `

    ${watch.length ? `<div class="drops">${watch.join("")}</div>` : `<p class="note">Star a car on New cars or Used cars to follow its price here.</p>`}
  </section>
  <section>
    <div class="head"><div><h2>Since your last visit</h2><p>${ch ? `What moved between the build you last saw, ${esc(when)}, and this one.` : "Changes show from your next visit: this browser keeps a small copy of today's prices to compare against."}</p></div></div>
    ${!ch ? "" : ch.count ? `<div class="alerts">${lists}</div>` : `<p class="note">Nothing moved since your last visit.</p>`}
  </section>`;
}

function defaultCostSel() {

    : ([...cars.values()].find(c => c.url === p.url && p.name.startsWith(c.label.split(" ").slice(0, 3).join(" "))) || {}).id || "").slice(0, 3);

    ${head(`Running costs, per ${per}`, per === "month" ? "the yearly figure divided by 12" : "")}

/* ---------- motion, freshness, "how is this computed" ---------- */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)");
const FMT = {int, money, k};
const EASE = "cubic-bezier(.2,.8,.2,1)";
// Count-up: the markup already holds the final text; this only animates from zero (skipped under reduced motion).
function countUp(root) {
  if (REDUCED.matches) return;
  root.querySelectorAll("[data-count]").forEach(el => {
    const to = Number(el.dataset.count), f = FMT[el.dataset.fmt || "int"] || int, t0 = performance.now(), dur = 950;
    if (!isFinite(to)) return;
    const step = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = f(p >= 1 ? to : to * (1 - Math.pow(1 - p, 4))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  setTimeout(() => fitAll(root), 1050);   // the figures hold their final text now: refit
}
// Staggered entrance: tag the blocks of a freshly opened page with an index; CSS does the rest.
const RISE = ".head, .bento > *, .coe, .pick, .drop, .g, .rk, table.t, .bar, .count, .car, .tbl, .alerts, .empty, .two > div > h3";
function choreo(el) {
  if (REDUCED.matches) return;
  el.querySelectorAll(RISE).forEach((n, i) => { n.classList.add("rise"); n.style.setProperty("--i", Math.min(i, 16)); });
}
// Filter and sort transitions: cards that stay glide to their new place (FLIP, transform only); new ones fade up.
function rects(el) {
  const m = new Map();
  el.querySelectorAll("article.car[data-wkey]").forEach(c => m.set(c.dataset.wkey, c.getBoundingClientRect()));
  return m;
}
function flip(el, before) {
  let fresh = 0;
  el.querySelectorAll("article.car[data-wkey]").forEach(c => {
    const now = c.getBoundingClientRect(), old = before.get(c.dataset.wkey);
    if (now.top > innerHeight * 1.6 || now.bottom < -innerHeight) return;
    if (old) {
      const dx = old.left - now.left, dy = old.top - now.top;
      if (Math.abs(dx) + Math.abs(dy) > 2) c.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: "none"}], {duration: 520, easing: EASE});
    } else if (fresh++ < 36) c.animate([{opacity: 0, transform: "translateY(18px)"}, {opacity: 1, transform: "none"}], {duration: 480, easing: EASE, delay: Math.min(fresh, 10) * 25, fill: "backwards"});
  });
}
// Fit the big figures: shrink a number until it sits inside its tile, whatever its length.
const FIT = ".hero-coe .big, .tile .v, .pick .v, .coe .prem";
function fitAll(root = document) {
  root.querySelectorAll(FIT).forEach(el => {
    const box = el.closest(".hero-coe, .tile, .pick") || el.parentElement;
    if (!box.clientWidth) return;
    el.style.fontSize = "";
    const cs = getComputedStyle(box), room = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 30;
    let size = parseFloat(getComputedStyle(el).fontSize);
    for (let i = 0; i < 30 && el.getBoundingClientRect().width > room && size > 24; i++) { size *= .93; el.style.fontSize = size + "px"; }
  });
}
addEventListener("resize", () => fitAll());
document.fonts?.ready.then(() => fitAll());
document.fonts?.addEventListener("loadingdone", () => fitAll());
// Chequered-flag sweep across the top edge on every page change.
function sweep() {
  if (REDUCED.matches) return;
  $("#sweep").animate([{transform: "scaleX(0)", transformOrigin: "0 50%"}, {transform: "scaleX(1)", transformOrigin: "0 50%", offset: .5}, {transform: "scaleX(1)", transformOrigin: "100% 50%", offset: .5}, {transform: "scaleX(0)", transformOrigin: "100% 50%"}], {duration: 650, easing: "ease-in-out"});
}

/* Updated N h ago. #stamp is set by the data loader; this observer restyles it. Its own writes are told apart by comparing with the last text it wrote. */
const freshEl = $("#stamp");
let lastFresh = "";
function ago(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 2) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  return h < 48 ? h + " h ago" : Math.round(h / 24) + " d ago";
}
function paintFresh() {
  if (!D) return;
  const at = new Date(D.generated_at), age = Date.now() - at.getTime();
  lastFresh = "Updated " + ago(age);
  freshEl.textContent = lastFresh;
  freshEl.title = "Data built " + at.toLocaleString("en-SG") + " (" + D.run_date + " run)";
  freshEl.classList.toggle("stale", age > 30 * 3600e3);
}
new MutationObserver(() => { if (freshEl.textContent !== lastFresh) paintFresh(); }).observe(freshEl, {childList: true, characterData: true, subtree: true});
setInterval(paintFresh, 60000);

/* Live COE ticker, doubled so the belt loops without a jump. */
function paintTicker() {
  const rows = D.coe.rows || [];
  const one = rows.map(r => `<span class="it">Cat ${esc(r.cat)} <b>${money(r.premium)}</b>${r.delta == null ? "" : r.delta < 0 ? `<span class="dn">▼ ${int(-r.delta)}</span>` : r.delta > 0 ? `<span class="up">▲ ${int(r.delta)}</span>` : ""}</span>`).join("")
    + `<span class="it">Next results <b>${dmy(D.coe.next_results)}</b></span>`;
  $("#belt").innerHTML = one + one;
}

/* Click a headline number: what it counts or how it is worked out. Only what the code and page labels state. */
const HOW = {
  coe: () => ["COE Cat A", `<p>The winning premium of the latest tender for category A (cars up to 1,600 cc or 110 kW), ${esc(D.coe.exercise || "")}, results of ${dmyy(D.coe.tender_date)}.</p>
    <div class="eq">change = this premium minus the previous tender's<br>missed = bids minus successful bids</div>
    <p>The forecast is the last premium nudged a quarter of a typical move toward momentum and demand, with a range of one typical move. A range, not a call.</p>`],
  used: () => ["Live used listings", `<p>Every live used listing the tracker follows on Sgcarmart and Motorist today: <b>${D.stats.used_active}</b>.</p>
    <p>The smaller number, <b>${D.stats.used_passing}</b>, is the shortlist: the listings that pass the filters.</p>
    <ul><li>Price at most ${money(D.filters.price_ceiling)}</li><li>Up to ${int(D.filters.max_km_per_year)} km per year of age</li><li>At most ${D.filters.max_owners} owners</li><li>At least ${D.filters.min_coe_years} years of COE left</li></ul>`],
  new: () => ["New car variants priced", `<div class="eq">${D.stats.new_ev_variants} electric + ${D.stats.new_car_variants || 0} petrol, hybrid and diesel = ${int(D.stats.new_ev_variants + (D.stats.new_car_variants || 0))}</div>
    <p>Every variant on Sgcarmart's new car price list. Prices include COE; EV prices are net of the VES and EEAI rebates.</p>`],
  drops: () => ["Used cars cut in price", `<div class="eq">count of live used listings where<br>previous price &gt; current asking price</div>
    <p>It counts cars whose asking price is lower than the price the tracker recorded before. The Biggest price cuts list shows the largest of them against the price before the cut.</p>`],
  fresh: () => ["Listed today", `<p><b>${D.stats.new_today}</b> used listings were first seen by the tracker on ${esc(D.run_date)}. <b>${D.stats.gone}</b> listings were marked gone since yesterday.</p>`],
  annual: () => ["Cost a year", `<div class="eq">total, low = road tax + insurance (low) + depreciation + energy + servicing, tyres, parking and ERP</div>
    <p>The high figure uses the high insurance estimate. A new car's depreciation is spread over 10 years; a used car's is the listing's own figure. Assumptions: ${esc(D.costs.assumptions || "")}</p>`],
};
const howD = $("#howd");
function showHow(key) {
  const f = HOW[key]; if (!f || !D) return;
  const [t, b] = f();
  $("#how-t").textContent = t; $("#how-b").innerHTML = b;
  if (!howD.open) howD.showModal();
}
$("#how-x").addEventListener("click", () => howD.close());
howD.addEventListener("click", e => { if (e.target === howD) howD.close(); });
document.addEventListener("click", e => { const h = e.target.closest("[data-how]"); if (h) showHow(h.dataset.how); });

/* ---------- routing and events ---------- */
const VIEWS = {today, new: newView, used: usedView, brands: brandsView, bikes: bikesView, costs: costsView, guide: guideView};
let current = "";
function render(name, entering = false) {
  const el = document.getElementById(name);
  const before = !entering && !REDUCED.matches ? rects(el) : null;
  el.innerHTML = VIEWS[name]();
  wire(el, name);
  fitAll(el);
  if (entering) { choreo(el); countUp(el); el.classList.add("entering"); setTimeout(() => el.classList.remove("entering"), 2600); }
  else if (before) flip(el, before);
}
function show() {
  const name = (location.hash || "#today").slice(1).split("?")[0];
  if (!VIEWS[name]) { location.hash = "#today"; return; }
  document.querySelectorAll("nav a").forEach(a => a.getAttribute("href") === "#" + name ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === name));
  if (current !== name) { render(name, true); current = name; window.scrollTo({top: 0, behavior: "instant"}); sweep(); }
  if (FOCUS) {
    const card = [...document.querySelectorAll("#" + name + " [data-wkey]")].find(c => c.dataset.wkey === FOCUS);
    FOCUS = null;
    if (card) { card.scrollIntoView({block: "center"}); card.classList.add("flash"); }
  }
}
function wire(el, name) {
  el.querySelectorAll('.seg[data-f="per"]').forEach(g => g.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return; state.costs.per = b.dataset.v; render("costs");
  }));
  el.querySelectorAll("select.costpick").forEach(s => s.addEventListener("change", () => {
    state.costs.sel[Number(s.dataset.i)] = s.value; render("costs");
  }));
  const st = name === "costs" ? null : state[name];
  if (!st) {
    el.querySelectorAll("[data-sort]").forEach(a => a.addEventListener("click", () => { state.used.sort = a.dataset.sort; state.used.shortlist = false; current = ""; }));
    return;
  }
  el.querySelectorAll(".chips[data-f], .seg[data-f]").forEach(c => c.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    st[c.dataset.f] = b.dataset.v;
    if (c.dataset.f === "kind") { st.fuel = ""; st.dt = ""; st.body = ""; st.make = ""; }
    if (c.dataset.f === "dt" || c.dataset.f === "fuel") st.body = "";
    render(name);
  }));
  // Variant buttons redraw only their own card.
  el.addEventListener("click", e => {
    const b = e.target.closest(".vpill"); if (!b) return;
    state.newSel[b.dataset.key] = b.dataset.id;
    const card = b.closest("article.car"), vs = NEW_GROUPS.get(b.dataset.key);
    if (card && vs) card.outerHTML = newCard(vs);
  });
  el.querySelectorAll("select[data-f]").forEach(s => s.addEventListener("change", () => { st[s.dataset.f] = s.value; render(name); }));
  el.querySelectorAll("input[type=checkbox][data-f]").forEach(c => c.addEventListener("change", () => { st[c.dataset.f] = c.checked; render(name); }));
  const q = el.querySelector("input[type=search]");
  if (q) { let t; q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { st.q = q.value.trim().toLowerCase(); const pos = q.selectionStart; render(name); const nq = el.querySelector("input[type=search]"); nq.focus(); nq.setSelectionRange(pos, pos); }, 160); }); }
}
window.addEventListener("hashchange", show);
document.addEventListener("click", e => {
  const s = e.target.closest(".star");
  if (s) {
    const wkey = s.dataset.star;
    if (wkey in WATCH) delete WATCH[wkey];
    else WATCH[wkey] = {name: s.dataset.name, url: s.dataset.url, price: priceIn(CUR, wkey), on: D.run_date};
    saveWatch();
    document.querySelectorAll(".star").forEach(b => { if (b.dataset.star === wkey) b.setAttribute("aria-pressed", String(wkey in WATCH)); });
    navCount();
    if (current === "today") render("today");
    return;
  }
  const g = e.target.closest("[data-go]");
  if (g) goTo(g.dataset.go);
});

fetch("live/data.json", {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  D = d;
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem("snap")); } catch (e) { stored = null; }
  const snaps = nextSnaps(stored, snapOf(d));
  CUR = snaps.cur; PREV = okSnap(snaps.prev);
  try { localStorage.setItem("snap", JSON.stringify(snaps)); } catch (e) { /* storage full or off: no comparison next visit */ }
  const at = new Date(d.generated_at);
  $("#stamp").textContent = "Updated " + at.toLocaleDateString("en-SG", {weekday: "short", day: "numeric", month: "short"}) + ", " + at.toLocaleTimeString("en-SG", {hour: "2-digit", minute: "2-digit"});
  $("#foot-l").textContent = `Built ${at.toLocaleString("en-SG")} from the ${d.run_date} run. Prices and figures are the sites' own; estimates follow config.yaml.`;
  $("#loading").remove();
  paintTicker();
  show();
  navCount();
}).catch(err => { $("#loading").innerHTML = `<p>Could not load today's data (${esc(err.message)}). The tracker writes it after each morning run.</p>`; });
})();
</script>
</body>
</html>
