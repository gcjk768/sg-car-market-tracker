<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG Car Market · COE, new EVs and used cars, priced daily</title>
<meta name="description" content="Singapore car market, every morning: COE results and forecast, every new car on the price list, every live used listing with real cost of ownership, top selling brands, bikes and pump prices.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315171a'/%3E%3Cpath d='M14 40l6-14h24l6 14v10h-6v-4H20v4h-6zM21 38h22l-3-8H24z' fill='%23f2f1ec'/%3E%3Ccircle cx='22' cy='44' r='3' fill='%232a5bea'/%3E%3Ccircle cx='42' cy='44' r='3' fill='%232a5bea'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f1ec; --bg-2:#e9e8e1; --card:#fbfaf7; --ink:#15171a; --ink-2:#3b4047; --mute:#6c727a; --line:rgba(21,23,26,.11); --line-2:rgba(21,23,26,.2);
  --accent:#2a5bea; --accent-ink:#ffffff; --accent-soft:rgba(42,91,234,.1);
  --good:#15804a; --good-soft:rgba(21,128,74,.12); --bad:#c23b2b; --bad-soft:rgba(194,59,43,.12); --warn:#9a6b00; --warn-soft:rgba(154,107,0,.12);
  --shadow:0 1px 0 rgba(21,23,26,.05),0 14px 32px -20px rgba(21,23,26,.45);
  --display:"Outfit",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:14px; --r-s:8px;
}
[data-theme="dark"]{
  --bg:#0f1114; --bg-2:#15181d; --card:#181b20; --ink:#eef0f2; --ink-2:#c3c8cf; --mute:#8b929b; --line:rgba(238,240,242,.1); --line-2:rgba(238,240,242,.22);
  --accent:#7ea2ff; --accent-ink:#0b1430; --accent-soft:rgba(126,162,255,.14);
  --good:#4fd28c; --good-soft:rgba(79,210,140,.14); --bad:#ff8577; --bad-soft:rgba(255,133,119,.14); --warn:#e9b94d; --warn-soft:rgba(233,185,77,.14);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 32px -20px rgba(0,0,0,.8);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1114; --bg-2:#15181d; --card:#181b20; --ink:#eef0f2; --ink-2:#c3c8cf; --mute:#8b929b; --line:rgba(238,240,242,.1); --line-2:rgba(238,240,242,.22);
  --accent:#7ea2ff; --accent-ink:#0b1430; --accent-soft:rgba(126,162,255,.14);
  --good:#4fd28c; --good-soft:rgba(79,210,140,.14); --bad:#ff8577; --bad-soft:rgba(255,133,119,.14); --warn:#e9b94d; --warn-soft:rgba(233,185,77,.14);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 32px -20px rgba(0,0,0,.8);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--body);
  background-image:radial-gradient(900px 420px at 100% -10%,var(--accent-soft),transparent 65%)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
button,select,input{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0;line-height:1.15}
h2{font-size:26px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:13px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:0;white-space:nowrap}
.brand svg{width:28px;height:28px}
.brand small{display:block;font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:4px}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav a:hover:not([aria-current]){background:var(--bg-2)}
.theme{border:1px solid var(--line-2);background:transparent;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.theme svg{width:18px;height:18px}
@media (max-width:760px){
  .top .wrap{height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:8px;gap:8px 12px}
  .brand{order:1} .theme{order:2;margin-left:auto}
  nav{order:3;width:100%;margin-left:0;margin:0 -20px;padding:0 20px;width:calc(100% + 40px)}
}

/* views */
main{padding:26px 0 60px}
.view{display:none}
.view.on{display:block;animation:rise .35s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}html{scroll-behavior:auto}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.head p{max-width:62ch;color:var(--ink-2)}
section+section{margin-top:34px}

/* today */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:stretch}
.hero-coe{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:22px 24px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
[data-theme="dark"] .hero-coe{background:var(--card);color:var(--ink);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero-coe{background:var(--card);color:var(--ink);border:1px solid var(--line)}}
.hero-coe .label{font:600 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.hero-coe .big{font-family:var(--display);font-weight:700;font-size:clamp(40px,6vw,64px);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero-coe .row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
.hero-coe svg{width:100%;height:64px;display:block}
.hero-coe .foot{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px;box-shadow:var(--shadow)}
.tile .v{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:0;line-height:1;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--mute);margin-top:8px}
.tile a{color:var(--accent);font-weight:600;text-decoration:none;font-size:13px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
@media (max-width:480px){.tiles{grid-template-columns:1fr 1fr;gap:8px}.tile{padding:12px 14px;min-height:96px}.tile .v{font-size:26px}}

.coe-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:1000px){.coe-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:620px){.coe-grid{grid-template-columns:1fr 1fr}}
.coe{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.coe .cat{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.coe .cat .small{text-align:right}
.coe .cat b{font-family:var(--display);font-size:15px}
.coe .prem{font-family:var(--mono);font-weight:600;font-size:21px}
.coe svg{width:100%;height:44px;display:block}
.coe .fc{font-size:12.5px;color:var(--ink-2);font-family:var(--body);line-height:1.45}
.coe .fc b{font-family:var(--mono);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font:600 12px/1.6 var(--body);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.flat{background:var(--bg-2);color:var(--ink-2)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ink{background:var(--ink);color:var(--bg)}
.note{font-size:13px;color:var(--mute);line-height:1.55}
details.note summary{cursor:pointer;color:var(--ink-2);font-weight:600}
.links a{color:var(--accent);font-weight:600;text-decoration:none;font-size:13px}
.links a+a::before{content:"·";color:var(--mute);margin:0 8px}
.srcs a{color:var(--accent);font-weight:600;text-decoration:none;font-size:13px}

.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.picks{grid-template-columns:1fr}}
.pick{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.pick .lab{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pick .nm{font-weight:700;margin:6px 0 10px;font-size:15px}
.pick .nm a{text-decoration:none}
.pick .v{font-family:var(--mono);font-weight:600;font-size:21px}
.pick .v small{font:500 12px var(--body);color:var(--mute)}
.pick dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:13px}
.pick dt{color:var(--mute)} .pick dd{margin:0;font-family:var(--mono);text-align:right}

.fuel{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.fuel{grid-template-columns:1fr}}
.fuel>div{min-width:0;overflow-x:auto}
@media (max-width:480px){table.t th,table.t td{padding:8px 7px}}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
table.t th,table.t td{padding:9px 12px;text-align:right;font-family:var(--mono)}
table.t th{font:600 12px/1.4 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:var(--bg-2)}
table.t th:first-child,table.t td:first-child{text-align:left;font-family:var(--body);font-weight:600}
table.t tr+tr td{border-top:1px solid var(--line)}
table.t td.min{color:var(--good);font-weight:600}
.drops{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.drop{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;text-decoration:none;display:flex;flex-direction:column;gap:4px}
.drop b{font-size:14px}
.drop .chip{align-self:flex-start}
.drop .num{font-size:13px;color:var(--ink-2)}

/* filter bar */
.bar{position:sticky;top:64px;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 -20px;padding:10px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.bar{top:0}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chips button span{font-family:var(--mono);font-weight:500;color:var(--mute);font-size:12px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button[aria-pressed="true"] span{color:inherit;opacity:.7}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrls select,.ctrls input{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r-s);padding:7px 10px;font-size:13.5px;min-width:0}
.ctrls input[type=search]{flex:1 1 240px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;padding:4px 0}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.count{font-size:13.5px;color:var(--ink-2);margin:14px 0 10px}
.count b{font-family:var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}

/* car cards */
.car{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative}
.car.off{opacity:.78}
.car .top-row{display:flex;flex-direction:column;gap:8px}
.car .shot{display:block;margin:-16px -16px 0;aspect-ratio:2/1;background:#fff;border-radius:var(--r) var(--r) 0 0;overflow:hidden;border-bottom:1px solid var(--line)}
.car .shot img{width:100%;height:100%;object-fit:contain;display:block}
.mcell{display:flex;align-items:center;gap:10px;text-align:left}
.thumb{width:72px;flex:none;aspect-ratio:3/2;object-fit:contain;background:#fff;border-radius:6px}
.car h3{font-size:17px;line-height:1.2}
.car h3 a{text-decoration:none}
.car h3 a:hover{text-decoration:underline}
.car .sub{font-size:13px;color:var(--mute);margin-top:3px}
.car .badges{display:flex;gap:5px;flex-wrap:wrap}
.car .v360{text-decoration:none}
.car .v360:hover{text-decoration:underline}
.car .price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.car .price .p{font-family:var(--mono);font-weight:600;font-size:22px}
.car .price .p small{font:500 12px var(--body);color:var(--mute);margin-left:4px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px;font-size:12.5px}
.specs div{display:flex;flex-direction:column;gap:1px}
.specs span{color:var(--mute);font-size:11.5px}
.specs b{font-family:var(--mono);font-weight:500;font-size:13.5px}
.car .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.car .foot a{color:var(--accent);font-weight:600;text-decoration:none}
.variants{margin:0;padding:0;list-style:none;border-top:1px solid var(--line);font-size:13px}
.variants li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.variants li:last-child{border-bottom:0}
.variants .n{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.variants .v{font-family:var(--mono);white-space:nowrap}
.promo{font-size:12.5px;color:var(--ink-2);background:var(--accent-soft);border-radius:var(--r-s);padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:100%;height:36px;display:block}
.reason{font-size:12px;color:var(--warn);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--card);padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
details.vlist summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--accent);list-style:none}
details.vlist summary::-webkit-details-marker{display:none}
details.vlist summary::after{content:" +"} details.vlist[open] summary::after{content:" \2212"}
details.vlist .variants{margin-top:6px}
.tbl{overflow-x:auto;border-radius:var(--r)}
table.list td{vertical-align:top;white-space:nowrap}
table.list td:first-child{white-space:normal;min-width:200px}
table.list td a{text-decoration:none;font-weight:700}
table.list tr.off td{opacity:.72}
table.list tbody tr:hover td{background:var(--accent-soft)}
.flags{margin:0;padding:8px 10px 8px 28px;border-radius:var(--r-s);background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600;line-height:1.45}
.flags li::marker{content:"⚠ "}
.kindrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg.kind{margin-left:0}
.seg.kind button{padding:8px 18px;font-size:14px;font-weight:700}
.seg.kind button span{font-family:var(--mono);font-weight:500;font-size:12px;opacity:.65;margin-left:4px}
.vpills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.vpill{border:1px solid var(--line-2);background:var(--card);border-radius:var(--r-s);padding:5px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-width:100%;text-align:left}
.vpill{min-width:0}
.vpill .vn{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vpill .vp{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.vpill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vpill[aria-pressed="true"] .vp{color:inherit;opacity:.75}
.vpill:hover:not([aria-pressed="true"]){border-color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--mute);border:1px dashed var(--line-2);border-radius:var(--r)}

/* brands */
.rank{display:flex;flex-direction:column;gap:8px}
.rk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:grid;grid-template-columns:34px 1fr auto;gap:6px 12px;align-items:center}
.rk .n{font-family:var(--mono);font-weight:600;color:var(--mute);font-size:14px}
.rk .mk{font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rk .bar-s{height:6px;border-radius:3px;background:var(--bg-2);overflow:hidden;grid-column:2/4}
.rk .bar-s i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rk .regs{font-family:var(--mono);font-size:13px;color:var(--ink-2);text-align:right}
.rk .models{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.rk .models span{font-size:12.5px;border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;display:inline-flex;gap:6px}
.rk .models span b{font-family:var(--mono);font-weight:500}
.rk .models span.np{color:var(--mute);border-style:dashed}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}

/* costs */
.cost-table{overflow-x:auto}
.cost-table table.t td{font-size:14px}
table.costs th{vertical-align:top;text-transform:none;letter-spacing:0;min-width:200px}
table.costs th:first-child{min-width:150px}
table.costs tr.sect td{background:var(--bg-2);font:700 12px/1.4 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:left}
table.costs tr.sect td span{text-transform:none;letter-spacing:0;font-weight:500;color:var(--mute);margin-left:6px}
.costpick{width:100%;max-width:280px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:var(--r-s);padding:7px 8px;font:600 13px var(--body)}
.pickmeta{margin-top:6px;font:500 12px/1.45 var(--body);color:var(--mute);text-align:left}
.pickmeta a{color:var(--accent);text-decoration:none;font-weight:600}
.cost-table tr.total td{font-weight:700;background:var(--accent-soft)}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.guide{grid-template-columns:1fr}}
.g{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.g p,.g li{font-size:14px;color:var(--ink-2);line-height:1.55}
.g ul{margin:0;padding-left:18px}
.g.wide{grid-column:1/-1}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:13px;color:var(--mute)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#loading{padding:80px 20px;text-align:center;color:var(--mute)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--bg-2),var(--card),var(--bg-2));background-size:200% 100%;animation:sh 1.2s linear infinite;margin:10px auto;max-width:420px}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#today" aria-label="SG Car Market, home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="currentColor"/><path d="M14 40l6-14h24l6 14v10h-6v-4H20v4h-6zM21 38h22l-3-8H24z" fill="var(--bg)"/><circle cx="22" cy="44" r="3" fill="var(--accent)"/><circle cx="42" cy="44" r="3" fill="var(--accent)"/></svg>
      <span>SG Car Market<small id="stamp">loading</small></span>
    </a>
    <nav aria-label="Sections">
      <a href="#today">Today</a><a href="#new">New cars</a><a href="#used">Used cars</a><a href="#brands">Brands</a><a href="#bikes">Bikes</a><a href="#costs">Costs</a><a href="#guide">Guide</a>
    </nav>
    <button class="theme" id="theme" type="button" aria-label="Switch light or dark theme" title="Light or dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div id="loading"><div class="skel"></div><div class="skel" style="max-width:300px"></div><p>Loading today's market</p></div>
  <div id="today" class="view"></div>
  <div id="new" class="view"></div>
  <div id="used" class="view"></div>
  <div id="brands" class="view"></div>
  <div id="bikes" class="view"></div>
  <div id="costs" class="view"></div>
  <div id="guide" class="view"></div>
</main>
<footer><div class="wrap"><span id="foot-l"></span><span>Prices from Sgcarmart and Motorist, COE from Motorist and LTA via data.gov.sg, registrations from LTA, bikes from SGBikemart, pump prices from Motorist.</span></div></footer>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (v, d = "$") => v == null ? "n/a" : d + Math.round(v).toLocaleString("en-SG");
const k = v => v == null ? "n/a" : "$" + (Math.round(v / 1000)) + "k";
const int = v => v == null ? "n/a" : Math.round(v).toLocaleString("en-SG");
const dmy = s => { if (!s) return ""; const d = new Date(s); return d.toLocaleDateString("en-SG", {weekday: "short", day: "numeric", month: "short"}); };
const dmyy = s => { if (!s) return ""; const d = new Date(s); return d.toLocaleDateString("en-SG", {day: "numeric", month: "short", year: "numeric"}); };
const BODY_ORDER = ["SUV", "Sedan", "Hatchback", "MPV", "Coupe", "Wagon", "Other"];
const BODY_LABEL = {SUV: "SUV and crossover", Sedan: "Sedan", Hatchback: "Hatchback", MPV: "MPV", Coupe: "Coupe", Wagon: "Wagon", Other: "Other"};
const BUDGETS = [["", "Any budget"], ["0-100000", "Under $100k"], ["100000-150000", "$100k to $150k"], ["150000-200000", "$150k to $200k"], ["200000-300000", "$200k to $300k"], ["300000-", "$300k and up"]];
const DT = {ev: "Electric", hybrid: "Hybrid", ice: "Petrol"};
let D = null;
const state = {
  new: {kind: "ev", fuel: "", body: "", budget: "", cat: "", make: "", q: "", sort: "popular", layout: "cards"},
  newSel: {},
  costs: {sel: null, per: "year"},
  used: {kind: "ev", dt: "", body: "", budget: "", make: "", km: "", coe: "", owners: "", shortlist: true, q: "", sort: "best", src: "", layout: "cards"},
  bikes: {cls: "2B"},
};

/* theme */
const themeBtn = $("#theme");
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(localStorage.getItem("theme") || "");
themeBtn.addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  localStorage.setItem("theme", next); applyTheme(next);
});

/* sparkline: polyline with a baseline, last point marked */
function spark(points, {w = 200, h = 44, stroke = "currentColor", fill = false} = {}) {
  if (!points || points.length < 2) return "";
  const vals = points.map(p => p.v), min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const x = i => (i / (points.length - 1)) * (w - 8) + 4, y = v => h - 6 - ((v - min) / span) * (h - 12);
  const d = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const last = points[points.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    ${fill ? `<path d="${d} L${(w - 4).toFixed(1)},${h} L4,${h} Z" fill="${stroke}" opacity=".1"/>` : ""}
    <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(points.length - 1).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="3.5" fill="${stroke}"/></svg>`;
}
const delta = (d, pct) => d == null ? `<span class="chip flat">first tender</span>`
  : d < 0 ? `<span class="chip good">▼ ${int(-d)}${pct != null ? ` · ${Math.abs(pct).toFixed(1)}%` : ""}</span>`
  : d > 0 ? `<span class="chip bad">▲ ${int(d)}${pct != null ? ` · ${pct.toFixed(1)}%` : ""}</span>`
  : `<span class="chip flat">unchanged</span>`;
const finLine = f => f && f.deposit ? `<div><span>Deposit</span><b>${money(f.deposit)}</b></div><div><span>Monthly, ${f.tenure}y</span><b>${money(f.monthly)}</b></div>` : "";
const span = a => k(a.total_low) === k(a.total_high) ? k(a.total_low) : `${k(a.total_low)} to ${k(a.total_high)}`;
const annualLine = a => a ? `<div><span>Cost a year</span><b>${span(a)}</b></div>` : "";
const badge = (txt, cls = "flat") => `<span class="chip ${cls}">${esc(txt)}</span>`;
const opt = (list, cur, all) => `<option value="">${all}</option>` + list.map(v => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
const inBudget = (p, b) => { if (!b || p == null) return true; const [lo, hi] = b.split("-").map(Number); return p >= (lo || 0) && (!hi || p < hi); };

/* ---------- TODAY ---------- */
function today() {
  const c = D.coe, s = D.stats, a = c.rows?.find(r => r.cat === "A");
  const picks = D.costs.picks || [];
  const cheapest = picks.length ? picks.reduce((m, p) => p.total_low < m.total_low ? p : m) : null;
  const drops = D.used.filter(u => u.prev_price && u.prev_price > u.price).map(u => ({...u, pct: (u.prev_price - u.price) / u.prev_price * 100}))
    .sort((x, y) => y.pct - x.pct).slice(0, 6);
  const deals = D.used.filter(u => u.passes && u.deal).sort((x, y) => x.deal.pct - y.deal.pct).slice(0, 6);
  const news = (D.news || []).slice(0, 6);
  const fuel = D.fuel || {}, grades = ["92", "95", "98", "Premium", "Diesel"].filter(g => Object.values(fuel.grades || {}).some(b => b[g] != null));
  const brands = Object.keys(fuel.grades || {}).sort((x, y) => (fuel.grades[x]["95"] ?? 9) - (fuel.grades[y]["95"] ?? 9));
  const minOf = g => Math.min(...brands.map(b => fuel.grades[b][g]).filter(v => v != null));
  return `
  <section class="hero">
    <div class="hero-coe">
      <div class="label">COE Cat A · ${esc(c.exercise || "")}</div>
      <div class="row">
        <div class="big num">${a ? money(a.premium) : "n/a"}</div>
        <div>${a ? delta(a.delta, a.delta_pct) : ""}<div class="small" style="margin-top:6px;opacity:.85">${a?.bids ? `${int(a.bids)} bids for ${int(a.quota)} · ${int(a.bids - a.successful)} missed` : ""}</div></div>
      </div>
      ${a ? spark(a.history.map(h => ({v: h.premium})), {w: 400, h: 64, stroke: "currentColor", fill: true}) : ""}
      <div class="foot">
        <span>Next results <b>${dmy(c.next_results)}</b></span>
        <span>Bidding ${dmy(c.bidding_opens)} ${c.bidding_opens?.slice(11, 16)} to ${dmy(c.bidding_closes)} ${c.bidding_closes?.slice(11, 16)}</span>
        ${a?.forecast ? `<span>Forecast <b class="num">${money(a.forecast.point)}</b> · ${k(a.forecast.low)} to ${k(a.forecast.high)}</span>` : ""}
      </div>
    </div>
    <div class="tiles">
      <div class="tile"><div class="v num">${s.used_active}</div><div class="k">live used listings, <b>${s.used_passing}</b> pass your filters<br><a href="#used">Browse used</a></div></div>
      <div class="tile"><div class="v num">${int(s.new_ev_variants + (s.new_car_variants || 0))}</div><div class="k">new car variants priced, ${s.new_ev_variants} electric<br><a href="#new">Browse new cars</a></div></div>
      <div class="tile"><div class="v num ${s.drops ? "good" : ""}">${s.drops}</div><div class="k">used cars cut in price since listing<br><a href="#used" data-sort="drop">See the drops</a></div></div>
      <div class="tile"><div class="v num">${s.new_today}</div><div class="k">listed today · ${s.gone} gone since yesterday</div></div>
    </div>
  </section>

  <section>
    <div class="head"><div><h2>COE position</h2><p>${esc(c.exercise || "")}, results of ${dmyy(c.tender_date)}. Twelve tenders of history behind each category, forecast for ${dmy(c.next_results)}.</p></div></div>
    <div class="coe-grid">${(c.rows || []).map(r => `
      <article class="coe">
        <div class="cat"><b>Cat ${r.cat}</b> <span class="small mute">${{A: "to 1,600 cc or 110 kW", B: "above that", C: "goods", D: "motorcycles", E: "open"}[r.cat] || ""}</span></div>
        <div class="prem num">${money(r.premium)}</div>
        <div>${delta(r.delta, r.delta_pct)}</div>
        ${spark(r.history.map(h => ({v: h.premium})), {stroke: "var(--accent)"})}
        <div class="fc small mute">${r.bids ? `${int(r.bids)} bids · ${int(r.quota)} quota · ${int(r.bids - r.successful)} missed` : ""}</div>
        ${r.forecast ? `<div class="fc">Next <b>${money(r.forecast.point)}</b> · ${k(r.forecast.low)} to ${k(r.forecast.high)}</div>` : ""}
      </article>`).join("")}</div>
    <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
      ${(c.events || []).map(e => `<div class="small"><b>${dmy(e.on)}</b> · ${esc(e.text)}</div>`).join("")}
      <div class="links"><a href="${esc(D.sources.motorist_coe)}" target="_blank" rel="noopener">COE results</a><a href="${esc(D.sources.datagov_coe_page)}" target="_blank" rel="noopener">LTA history on data.gov.sg</a></div>
      ${c.forecast_note ? `<details class="note"><summary>How the forecast works</summary>The forecast is the last premium nudged a quarter of a typical move toward momentum and demand, with a range of one typical move. COE moves almost like a random walk, and backtested on LTA history this misses 1 to 4 percent less than no change. A range, not a call.</details>` : ""}
    </div>
  </section>

  ${news.length ? `<section>
    <div class="head"><div><h2>News</h2><p>LTA releases that touch buying or owning a car: COE, quotas, ARF and PARF, VES and EEAI, road tax and ERP.</p></div></div>
    <div class="drops">${news.map(n => `<a class="drop" href="${esc(n.link)}" target="_blank" rel="noopener"><b>${esc(n.title)}</b><span class="small mute">${dmyy(n.published)}</span>${n.summary ? `<span class="small">${esc(n.summary.length > 140 ? n.summary.slice(0, 139) + "…" : n.summary)}</span>` : ""}</a>`).join("")}</div>
  </section>` : ""}

  ${picks.length ? `<section>
    <div class="head"><div><h2>Cheapest to own today</h2><p>The daily run's three picks: the best selling new EV, then the top car of each used shortlist. Estimated yearly cost with road tax, insurance, depreciation, energy and extras.</p></div><span class="links"><a href="#costs">Full comparison</a></span></div>
    <div class="picks">${picks.map(p => `
      <article class="pick${p === cheapest ? "" : ""}">
        <div class="lab">${esc(p.label)}${p === cheapest ? ` · <span class="good">lowest</span>` : ""}</div>
        <div class="nm"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a></div>
        <div class="v">${money(p.total_low)} <small>to ${money(p.total_high)} a year</small></div>
        <dl><dt>Depreciation</dt><dd>${money(p.depreciation)}</dd><dt>Energy</dt><dd>${money(p.energy)}</dd><dt>Road tax</dt><dd>${money(p.road_tax)}</dd>${p.finance?.deposit ? `<dt>Deposit · monthly</dt><dd>${k(p.finance.deposit)} · ${money(p.finance.monthly)}</dd>` : ""}</dl>
      </article>`).join("")}</div>
  </section>` : ""}

  ${deals.length ? `<section>
    <div class="head"><div><h2>Best deals today</h2><p>Shortlisted used cars that depreciate least against similar live listings of the same model and fuel, registered within a year of each other.</p></div><span class="links"><a href="#used">All used cars</a></span></div>
    <div class="drops">${deals.map(u => `<a class="drop" href="${esc(u.url)}" target="_blank" rel="noopener"><b>${esc(u.name)} ${u.year || ""}</b><span class="num">${money(u.price)}</span>${dealChip(u.deal)}<span class="small mute">${u.deal.similar} similar cars, median ${money(u.deal.median)} a year${u.red_flags?.length ? ` · <span class="warn">⚠ ${esc(u.red_flags[0])}</span>` : ""}</span></a>`).join("")}</div>
  </section>` : ""}

  <section class="fuel">
    <div>
      <div class="head"><div><h2>Pump prices</h2><p>Listed per litre before card or loyalty discounts, ${dmyy(fuel.observed_on)}. Cheapest per grade in green.</p></div></div>
      ${brands.length ? `<table class="t"><thead><tr><th>Station</th>${grades.map(g => `<th>${esc(g)}</th>`).join("")}</tr></thead><tbody>
        ${brands.map(b => `<tr><td>${esc(b)}</td>${grades.map(g => { const v = fuel.grades[b][g]; return `<td class="${v != null && v === minOf(g) ? "min" : ""}">${v != null ? v.toFixed(2) : "n/a"}</td>`; }).join("")}</tr>`).join("")}
      </tbody></table>` : `<div class="empty">No pump price board today.</div>`}
    </div>
    <div>
      <div class="head"><div><h2>Biggest price cuts</h2><p>Used cars whose asking price was cut the most, against the price before the cut.</p></div></div>
      ${drops.length ? `<div class="drops">${drops.map(u => `<a class="drop" href="${esc(u.url)}" target="_blank" rel="noopener"><b>${esc(u.name)} ${u.year || ""}</b><span class="num">${money(u.price)} <span class="good">▼ ${money(u.prev_price - u.price)} · ${u.pct.toFixed(1)}%</span></span><span class="num small mute">was ${money(u.prev_price)} · ${u.days_listed} days listed · ${esc(u.source)}</span></a>`).join("")}</div>` : `<div class="empty">No price cuts yet.</div>`}
    </div>
  </section>`;
}

/* ---------- NEW CARS ---------- */
const FUEL = {ev: "Electric", hybrid: "Hybrid", petrol: "Petrol", diesel: "Diesel"};
let ALL_NEW = null;
const allNew = () => ALL_NEW || (ALL_NEW = D.new_evs.map(v => ({...v, fuel: "ev"})).concat(D.new_cars || []));
// The EV / ICE switch at the top of New cars and Used cars. ICE is everything with an engine: petrol, hybrid, diesel.
function kindToggle(st, counts) {
  const opts = [["ev", "EV"], ["ice", "ICE"], ["all", "All"]];
  return `<div class="seg kind" data-f="kind" role="group" aria-label="Electric or engine">${opts.map(([v, l]) =>
    `<button type="button" data-v="${v}" aria-pressed="${st.kind === v}">${l} <span>${counts[v] ?? 0}</span></button>`).join("")}</div>`;
}
function viewToggle(st) {
  return `<div class="seg" data-f="layout" role="group" aria-label="Layout"><button type="button" data-v="cards" aria-pressed="${st.layout !== "table"}">Cards</button><button type="button" data-v="table" aria-pressed="${st.layout === "table"}">Table</button></div>`;
}
function newView() {
  const st = state.new, all = allNew();
  const byKind = all.filter(v => st.kind === "all" || (st.kind === "ev") === (v.fuel === "ev"));
  const byFuel = byKind.filter(v => st.kind !== "ice" || !st.fuel || v.fuel === st.fuel);
  const fuelCounts = {}; all.forEach(v => fuelCounts[v.fuel] = (fuelCounts[v.fuel] || 0) + 1);
  const kindCounts = {ev: fuelCounts.ev || 0, ice: all.length - (fuelCounts.ev || 0), all: all.length};
  const bodyCounts = {}; byFuel.forEach(v => bodyCounts[v.body] = (bodyCounts[v.body] || 0) + 1);
  const makes = [...new Set(byFuel.map(v => v.make))].sort((x, y) => x.localeCompare(y));
  let rows = byFuel.filter(v => (!st.body || v.body === st.body) && inBudget(v.price, st.budget) && (!st.cat || v.cat === st.cat) && (!st.make || v.make === st.make)
    && (!st.q || v.name.toLowerCase().includes(st.q)));
  const sorters = {popular: byPopular, price: (x, y) => (x.price ?? 9e9) - (y.price ?? 9e9), price_desc: (x, y) => (y.price ?? 0) - (x.price ?? 0),
    power: (x, y) => (y.power_kw ?? 0) - (x.power_kw ?? 0), brand: (x, y) => (x.brand_rank ?? 999) - (y.brand_rank ?? 999) || (x.price ?? 9e9) - (y.price ?? 9e9),
    annual: (x, y) => (x.annual?.total_low ?? 9e9) - (y.annual?.total_low ?? 9e9), cut: (x, y) => (x.price_change ?? 0) - (y.price_change ?? 0)};
  rows.sort(sorters[st.sort] || byPopular);
  const groups = new Map();
  rows.forEach(v => { const key = v.make + "|" + v.model; if (!groups.has(key)) groups.set(key, []); groups.get(key).push(v); });
  const models = [...groups.values()];
  NEW_GROUPS = groups;
  return `
  <div class="head"><div><h2>New cars</h2><p>Every new car on Sgcarmart's price list, ${int(all.length)} variants: electric, hybrid and petrol. ${D.stats.official_matched ? `${int(D.stats.official_matched)} variants carry the brand's own price, read from ${D.stats.official_brands} official websites; the rest are Sgcarmart's.` : ""} Prices with COE; EV prices are net of the VES and EEAI rebates. Deposit is the MAS minimum, instalment at ${(D.costs.rates.new * 100).toFixed(2)}% flat over ${D.costs.rates.tenure} years.</p></div></div>
  <div class="bar">
    <div class="kindrow">${kindToggle(st, kindCounts)}${st.kind === "ice" ? `<div class="chips" data-f="fuel"><button type="button" data-v="" aria-pressed="${st.fuel === ""}">All engines <span>${byKind.length}</span></button>${["hybrid", "petrol", "diesel"].filter(f => fuelCounts[f]).map(f => `<button type="button" data-v="${f}" aria-pressed="${st.fuel === f}">${FUEL[f]} <span>${fuelCounts[f]}</span></button>`).join("")}</div>` : ""}</div>
    <div class="chips" data-f="body"><button type="button" data-v="" aria-pressed="${st.body === ""}">All bodies <span>${byFuel.length}</span></button>${BODY_ORDER.filter(b => bodyCounts[b]).map(b => `<button type="button" data-v="${b}" aria-pressed="${st.body === b}">${BODY_LABEL[b]} <span>${bodyCounts[b]}</span></button>`).join("")}</div>
    <div class="ctrls">
      <input type="search" id="new-q" placeholder="Search make, model or variant" value="${esc(st.q)}" aria-label="Search new cars">
      <select data-f="budget" aria-label="Budget">${BUDGETS.map(([v, l]) => `<option value="${v}" ${v === st.budget ? "selected" : ""}>${l}</option>`).join("")}</select>
      <select data-f="cat" aria-label="COE category"><option value="">Any COE cat</option><option value="A" ${st.cat === "A" ? "selected" : ""}>Cat A only</option><option value="B" ${st.cat === "B" ? "selected" : ""}>Cat B only</option></select>
      <select data-f="make" aria-label="Brand">${opt(makes, st.make, "All brands")}</select>
      <select data-f="sort" aria-label="Sort">${[["popular", "Most popular"], ["brand", "Best selling brand"], ["price", "Price, low to high"], ["price_desc", "Price, high to low"], ["annual", "Cheapest to own"], ["cut", "Latest price cut"], ["power", "Most power"]].map(([v, l]) => `<option value="${v}" ${v === st.sort ? "selected" : ""}>${l}</option>`).join("")}</select>
      ${viewToggle(st)}
    </div>
  </div>
  <div class="count"><b>${models.length}</b> models · <b>${rows.length}</b> variants · ${st.kind === "ev" ? "electric" : st.kind === "ice" ? (st.fuel ? FUEL[st.fuel].toLowerCase() : "petrol, hybrid and diesel") : "all fuels"}${st.body ? ` · ${BODY_LABEL[st.body]}` : ""}</div>
  ${!models.length ? `<div class="empty">Nothing matches. Loosen a filter.</div>`
    : st.layout === "table" ? newTable(models) : `<div class="grid">${models.map(vs => newCard(vs)).join("")}</div>`}`;
}
// Sgcarmart's popularity order first, then the brand's LTA sales, then price. Unranked models go last.
// Sgcarmart's published best sellers first (each list's #1, then each #2, ...), then its popularity order,
// then the brand's LTA sales, then price. Unranked models go last.
const bestKey = c => c.best_seller ? c.best_seller.pos : 1e6;
const byPopular = (x, y) => bestKey(x) - bestKey(y) || (x.popularity ?? 1e6) - (y.popularity ?? 1e6) || (x.brand_rank ?? 999) - (y.brand_rank ?? 999) || (x.price ?? 9e9) - (y.price ?? 9e9);
// Deal verdict: depreciation a year against similar live listings (computed in insights.py).

/* ---------- USED ---------- */
function usedView() {
  const st = state.used;
  const isEv = u => u.drivetrain === "ev";
  const pool = D.used.filter(u => st.kind === "all" || (st.kind === "ev") === isEv(u)).filter(u => st.kind !== "ice" || !st.dt || u.drivetrain === st.dt);
  const counts = {ev: 0, hybrid: 0, ice: 0}; D.used.forEach(u => counts[u.drivetrain]++);
  const kindCounts = {ev: counts.ev, ice: counts.hybrid + counts.ice, all: D.used.length};
  const bodyCounts = {}; pool.forEach(u => bodyCounts[u.body] = (bodyCounts[u.body] || 0) + 1);
  const makes = [...new Set(pool.map(u => u.make))].sort((x, y) => x.localeCompare(y));
  let rows = pool.filter(u => (!st.body || u.body === st.body) && inBudget(u.price, st.budget) && (!st.make || u.make === st.make)
    && (!st.km || (u.mileage_km != null && u.mileage_km <= Number(st.km))) && (!st.coe || (u.coe_left != null && u.coe_left >= Number(st.coe)))
    && (!st.owners || (u.owners != null && u.owners <= Number(st.owners))) && (!st.shortlist || u.passes) && (!st.src || u.source === st.src)
    && (!st.q || (u.name + " " + (u.year || "")).toLowerCase().includes(st.q)));
  const sorters = {// Shortlisted cars, then the best selling brand, then lowest depreciation, then mileage.
    deal: (x, y) => (y.passes - x.passes) || (x.deal ? x.deal.pct : 1e6) - (y.deal ? y.deal.pct : 1e6),
    best: (x, y) => (y.passes - x.passes) || (x.brand_rank ?? 999) - (y.brand_rank ?? 999) || (x.dep_year ?? 9e9) - (y.dep_year ?? 9e9) || (x.mileage_km ?? 9e9) - (y.mileage_km ?? 9e9),
    dep: (x, y) => (x.dep_year ?? 9e9) - (y.dep_year ?? 9e9), price: (x, y) => x.price - y.price, price_desc: (x, y) => y.price - x.price,
    km: (x, y) => (x.mileage_km ?? 9e9) - (y.mileage_km ?? 9e9), coe: (x, y) => (y.coe_left ?? 0) - (x.coe_left ?? 0),
    newest: (x, y) => (x.days_listed ?? 999) - (y.days_listed ?? 999), drop: (x, y) => ((y.prev_price || y.price) - y.price) - ((x.prev_price || x.price) - x.price),
    annual: (x, y) => (x.annual?.total_low ?? 9e9) - (y.annual?.total_low ?? 9e9), brand: (x, y) => (x.brand_rank ?? 999) - (y.brand_rank ?? 999) || (x.dep_year ?? 9e9) - (y.dep_year ?? 9e9)};
  rows.sort((x, y) => (sorters[st.sort] || sorters.best)(x, y) || (y.passes - x.passes));
  if (st.sort === "dep") rows.sort((x, y) => (y.passes - x.passes) || (x.dep_year ?? 9e9) - (y.dep_year ?? 9e9));
  const f = D.filters;
  return `
  <div class="head"><div><h2>Used cars</h2><p>Every live listing the tracker follows on Sgcarmart and Motorist, ${D.stats.used_active} today. The shortlist filters are at most ${money(f.price_ceiling)}, up to ${int(f.max_km_per_year)} km a year, ${f.max_owners} owners, ${f.min_coe_years} years of COE left; cars outside them stay visible with the reason.</p></div></div>
  <div class="bar">
    <div class="kindrow">${kindToggle(st, kindCounts)}${st.kind === "ice" ? `<div class="chips" data-f="dt"><button type="button" data-v="" aria-pressed="${st.dt === ""}">All engines <span>${kindCounts.ice}</span></button>${["hybrid", "ice"].map(d => `<button type="button" data-v="${d}" aria-pressed="${st.dt === d}">${DT[d]} <span>${counts[d]}</span></button>`).join("")}</div>` : ""}</div>
    <div class="chips" data-f="body"><button type="button" data-v="" aria-pressed="${st.body === ""}">All bodies <span>${pool.length}</span></button>${BODY_ORDER.filter(b => bodyCounts[b]).map(b => `<button type="button" data-v="${b}" aria-pressed="${st.body === b}">${BODY_LABEL[b]} <span>${bodyCounts[b]}</span></button>`).join("")}</div>
    <div class="ctrls">

      <select data-f="km" aria-label="Mileage"><option value="">Any mileage</option>${[30000, 50000, 80000, 120000].map(v => `<option value="${v}" ${String(v) === st.km ? "selected" : ""}>Under ${int(v)} km</option>`).join("")}</select>

      <select data-f="owners" aria-label="Owners"><option value="">Any owners</option><option value="1" ${st.owners === "1" ? "selected" : ""}>1 owner</option><option value="2" ${st.owners === "2" ? "selected" : ""}>Up to 2 owners</option></select>

      <select data-f="sort" aria-label="Sort">${[["best", "Best selling"], ["deal", "Best deal"], ["dep", "Lowest depreciation a year"], ["annual", "Cheapest to own"], ["price", "Price, low to high"], ["price_desc", "Price, high to low"], ["drop", "Biggest price cut"], ["km", "Lowest mileage"], ["coe", "Most COE left"], ["newest", "Newest listing"]].map(([v, l]) => `<option value="${v}" ${v === st.sort ? "selected" : ""}>${l}</option>`).join("")}</select>

}

    <div class="foot"><span>${esc(u.source === "sgcarmart" ? "Sgcarmart" : "Motorist")} · ${u.days_listed != null ? `${u.days_listed} day${u.days_listed === 1 ? "" : "s"} listed` : ""}</span><a href="${esc(u.url)}" target="_blank" rel="noopener">Listing ↗</a></div>

  return `
  <div class="head"><div><h2>Motorbikes</h2><p>Used bikes on SGBikemart by licence class. Shortlist: at most ${money(b.filters?.price_ceiling_sgd)}, at least ${b.filters?.min_coe_years_remaining} years of COE left, believable mileage. Deposit ${Math.round((b.financing?.deposit_pct || 0) * 100)}%, instalment ${((b.financing?.flat_rate || 0) * 100).toFixed(1)}% flat over ${b.financing?.tenure_years} years or the COE left.</p></div></div>
  <div class="bar"><div class="chips" data-f="cls">${["2B", "2A", "2"].map(c => `<button type="button" data-v="${c}" aria-pressed="${st.cls === c}">${names[c]} <span>${(b.classes?.[c] || []).length}</span></button>`).join("")}</div></div>
  <div class="count"><b>${rows.length}</b> bikes · <b>${rows.filter(r => r.passes).length}</b> on the shortlist</div>
  ${rows.length ? `<div class="grid">${rows.map(r => `<article class="car ${r.passes ? "" : "off"}">
    <div class="top-row"><div><h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></h3><div class="sub">${r.year || ""}${r.cc ? ` · ${r.cc} cc` : ""}${r.type ? ` · ${esc(r.type)}` : ""}</div></div><div class="badges">${r.electric ? badge("Electric", "acc") : ""}${r.passes ? badge("Shortlist", "good") : ""}</div></div>
    <div class="price"><span class="p">${money(r.price)}</span></div>
    <div class="specs"><div><span>Mileage</span><b>${r.mileage_km != null ? int(r.mileage_km) + " km" : "not stated"}</b></div><div><span>COE left</span><b>${r.coe_left != null ? r.coe_left.toFixed(1) + " y" : "n/a"}</b></div><div><span>Depreciation a year</span><b>${money(r.dep_year)}</b></div>${r.finance ? `<div><span>Deposit</span><b>${money(r.finance.deposit)}</b></div><div><span>Monthly, ${r.finance.tenure}y</span><b>${money(r.finance.monthly)}</b></div>` : ""}</div>
    <div class="foot"><span>SGBikemart</span><a href="${esc(r.url)}" target="_blank" rel="noopener">Listing ↗</a></div></article>`).join("")}</div>` : `<div class="empty">No bikes read today.</div>`}
  ${b.brands?.length ? `<section><div class="head"><div><h2>Top selling bike brands</h2><p>New motorcycle registrations, LTA table M04.</p></div></div>
    <div class="rank" style="max-width:640px">${b.brands.map(r => `<div class="rk"><span class="n num">${r.rank}</span><span class="mk">${esc(brandName(r.make))}${r.electric ? badge(r.electric + " electric", "acc") : ""}</span><span class="regs">${int(r.regs)} · ${r.share}%</span><div class="bar-s"><i style="width:${(r.regs / maxB * 100).toFixed(1)}%"></i></div></div>`).join("")}</div></section>` : ""}`;
}

/* ---------- COSTS ---------- */
// Every car on the site, as one comparable row: the new car cards (EV list and full list) and the used listings.
let COST_CARS = null;
function costCars() {
  if (COST_CARS) return COST_CARS;
  const out = new Map();
  const newCards = D.new_evs.map(v => ({...v, fuel: "ev"})).concat(D.new_cars || []);
  for (const v of newCards) if (v.annual) out.set(v.id, {id: v.id, group: `New ${v.fuel === "ev" ? "EV" : "ICE"} · ${v.make}`, label: `${v.make} ${v.model} ${v.variant || ""}`.trim(),
    price: v.price, url: v.url, kind: v.fuel === "ev" ? "New EV" : `New ${FUEL[v.fuel] || "ICE"}`, ...v.annual, finance: v.finance});
  for (const u of D.used) if (u.annual) out.set(u.id, {id: u.id, group: `Used ${u.drivetrain === "ev" ? "EV" : "ICE"} · ${u.make}`,
    label: `${u.name} ${u.year || ""}`.trim(), price: u.price, url: u.url, kind: `Used ${DT[u.drivetrain]}`, ...u.annual, finance: u.finance,
    extra: `${u.mileage_km != null ? int(u.mileage_km) + " km · " : ""}${u.coe_left != null ? u.coe_left.toFixed(1) + "y COE · " : ""}${u.source === "sgcarmart" ? "Sgcarmart" : "Motorist"}`});
  COST_CARS = out;
  return out;
}
// The daily run's picks preselected; a pick from an older data file without ids is matched by name.
function defaultCostSel() {
  const cars = costCars();
  return (D.costs.picks || []).map(p => p.id && cars.has(p.id) ? p.id
    : ([...cars.values()].find(c => c.url === p.url && p.name.startsWith(c.label.split(" ").slice(0, 3).join(" "))) || {}).id || "").slice(0, 3);
}
function costSelect(i, sel, cars) {
  const groups = new Map();
  for (const c of [...cars.values()].sort((x, y) => x.group.localeCompare(y.group) || x.label.localeCompare(y.label) || x.price - y.price)) {
    if (!groups.has(c.group)) groups.set(c.group, []);
    groups.get(c.group).push(c);
  }
  return `<select class="costpick" data-i="${i}" aria-label="Car ${i + 1}"><option value="">None</option>${[...groups].map(([g, cs]) =>
    `<optgroup label="${esc(g)}">${cs.map(c => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.label)} · ${money(c.price)}</option>`).join("")}</optgroup>`).join("")}</select>`;
}
function costsView() {
  const c = D.costs, cars = costCars();
  if (!state.costs.sel) state.costs.sel = defaultCostSel();
  while (state.costs.sel.length < 3) state.costs.sel.push("");
  const p = state.costs.sel.map(id => cars.get(id) || null);
  const shown = p.map((x, i) => [x, i]);
  const lowest = Math.min(...p.filter(Boolean).map(x => x.total_low));
  const row = (label, get, cls = "") => `<tr class="${cls}"><td>${label}</td>${shown.map(([x]) => `<td>${x ? get(x) : ""}</td>`).join("")}</tr>`;
  const head = (label, note) => `<tr class="sect"><td colspan="${shown.length + 1}">${label}${note ? ` <span>${note}</span>` : ""}</td></tr>`;
  // Running costs are yearly figures; "Per month" divides them by 12.
  const per = state.costs.per, div = per === "month" ? 12 : 1, rc = v => money(v / div);
  // Cash leaving your account each month: the instalment plus the bills. Depreciation is left out, because it is
  // the car losing value rather than a payment, and the loan already pays for the car.
  const cashOut = x => x.finance?.monthly != null ? x.finance.monthly + (x.road_tax + x.insurance_low + x.energy + x.extras) / 12 : null;
  return `
  <div class="head"><div><h2>Cost of ownership</h2><p>Pick any car on the site in each column: every new car variant and every used listing. Running costs per year or per month, then the deposit and monthly loan under MAS rules. Cash out per month is the 7 year instalment plus road tax, low insurance, energy and upkeep; depreciation is not a payment, so it is left out. It opens on the daily run's three picks: the best selling new EV and the top car of each used shortlist.</p></div></div>
  <div class="seg" data-f="per" role="group" aria-label="Per year or per month" style="margin:0 0 12px">${[["year", "Per year"], ["month", "Per month"]].map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${per === v}">${l}</button>`).join("")}</div>
  <div class="cost-table"><table class="t costs"><thead><tr><th>Car</th>${shown.map(([x, i]) => `<th>${costSelect(i, state.costs.sel[i], cars)}${x ? `<div class="pickmeta">${esc(x.kind)} · ${money(x.price)}${x.extra ? `<br>${esc(x.extra)}` : ""}<br><a href="${esc(x.url)}" target="_blank" rel="noopener">Listing ↗</a></div>` : ""}</th>`).join("")}</tr></thead><tbody>
    ${head(`Running costs, per ${per}`, per === "month" ? "the yearly figure divided by 12" : "")}
    ${row("Road tax", x => rc(x.road_tax))}${row("Insurance, low", x => rc(x.insurance_low))}${row("Insurance, high", x => rc(x.insurance_high))}
    ${row("Depreciation", x => rc(x.depreciation))}${row("Energy", x => rc(x.energy))}${row("Servicing, tyres, parking, ERP", x => rc(x.extras))}
    ${row("Total, low", x => `${rc(x.total_low)}${p.filter(Boolean).length > 1 && x.total_low === lowest ? ` <span class="good">lowest</span>` : ""}`, "total")}${row("Total, high", x => rc(x.total_high), "total")}
    ${head("Buying with the minimum deposit", "one-off amounts, then per month")}
    ${row("Deposit, one-off", x => money(x.finance?.deposit))}${row("Loan amount", x => money(x.finance?.loan))}
    ${row("Instalment per month, 7 years", x => money(x.finance?.monthly))}${row("Instalment per month, 5 years", x => money(x.finance?.monthly_short))}
    ${row("Cash out per month", x => money(cashOut(x)), "total")}
  </tbody></table></div>
  <div class="guide" style="margin-top:16px">
    <div class="g"><h3>Assumptions</h3><p>${esc(c.assumptions)}</p><p>${int(c.annual_km)} km a year. Petrol 95 at ${D.fuel?.ron95?.toFixed(2) || "n/a"} per litre, the median listed pump price before discounts, ${dmyy(D.fuel?.observed_on)}. A new car's depreciation is spread over 10 years; a used car's is the listing's own figure.</p></div>
    <div class="g"><h3>Loan</h3><p>Deposit is the minimum under the MAS rules: 40% of price when OMV is above $20,000, 30% otherwise. Instalments use a flat rate of ${(c.rates.new * 100).toFixed(2)}% for new and ${(c.rates.used * 100).toFixed(2)}% for used cars. The ${c.rates.tenure} year loan costs the most interest; the ${c.rates.short} year figure shows the trade off.</p>
      <p class="links">${(c.insurance_links || []).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a>`).join("")}</p></div>
  </div>`;
}

/* ---------- GUIDE ---------- */
function guideView() {
  const g = D.guide, catA = D.coe.rows?.find(r => r.cat === "A")?.premium, catB = D.coe.rows?.find(r => r.cat === "B")?.premium;
  const verdict = catA != null ? (catA > g.cat_a_threshold ? "Today Cat A is above the threshold, which favours a well kept used car." : "Today Cat A is below the threshold, which keeps new cars competitive.") : "";
  const f = D.filters;
  return `
  <div class="head"><div><h2>Buying guide</h2><p>The rules that shape the numbers on every card. Assumptions last verified ${esc(g.verified_on)}; they live in config.yaml.</p></div></div>
  <div class="guide">
    <div class="g"><h3>New versus used today</h3><p>${esc(g.rule_of_thumb)}</p>${catA != null ? `<p><b class="num">Cat A ${money(catA)}</b>, <b class="num">Cat B ${money(catB)}</b>. ${verdict}</p>` : ""}</div>
    <div class="g"><h3>Loan rules</h3><p>${esc(g.loan_rules)}</p></div>
    <div class="g wide"><h3>ARF and PARF</h3><p>${esc(g.arf_parf)}</p></div>
    <div class="g"><h3>EV incentives</h3><ul>${(g.ev_incentives || []).map(i => `<li><b>${esc(i.name)}.</b> ${esc(String(i.detail).trim())}${i.ends ? ` Ends ${dmyy(i.ends)}.` : ""}</li>`).join("")}</ul></div>
    <div class="g"><h3>Policy watch</h3><ul>${(g.policy_watch || []).map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
    <div class="g"><h3>Used car shortlist filters</h3><ul><li>Price at most ${money(f.price_ceiling)}</li><li>Up to ${int(f.max_km_per_year)} km per year of age</li><li>At most ${f.max_owners} owners</li><li>At least ${f.min_coe_years} years of COE left</li><li>Age under ${f.max_age?.ev} years for an EV, ${f.max_age?.ice} for petrol and hybrid</li><li>No vans, lorries, accident or export cars</li></ul></div>
    <div class="g"><h3>Sources</h3><p class="srcs" style="display:flex;flex-direction:column;gap:4px">${[["LTA COE results", D.sources.onemotoring_coe], ["COE history on data.gov.sg", D.sources.datagov_coe_page], ["LTA tax structure", D.sources.lta_tax_structure], ["LTA PARF and COE rebate", D.sources.lta_parf], ["MAS motor vehicle loan rules", D.sources.mas_loan_rules], ["LTA registrations by make", D.sources.lta_registrations_by_make], ["Sgcarmart new car prices", D.sources.sgcarmart_new_cars], ["Pump prices", D.sources.fuel_price]].filter(x => x[1]).map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener" style="display:block">${n}</a>`).join("")}</p></div>
  </div>`;
}

/* ---------- routing and events ---------- */
const VIEWS = {today, new: newView, used: usedView, brands: brandsView, bikes: bikesView, costs: costsView, guide: guideView};
let current = "";
function render(name) {
  const el = document.getElementById(name);
  el.innerHTML = VIEWS[name]();
  wire(el, name);
}
function show() {
  const name = (location.hash || "#today").slice(1).split("?")[0];
  if (!VIEWS[name]) { location.hash = "#today"; return; }
  document.querySelectorAll("nav a").forEach(a => a.getAttribute("href") === "#" + name ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === name));
  if (current !== name) { render(name); current = name; window.scrollTo({top: 0, behavior: "instant"}); }
}
function wire(el, name) {
  el.querySelectorAll('.seg[data-f="per"]').forEach(g => g.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return; state.costs.per = b.dataset.v; render("costs");
  }));
  el.querySelectorAll("select.costpick").forEach(s => s.addEventListener("change", () => {
    state.costs.sel[Number(s.dataset.i)] = s.value; render("costs");
  }));
  const st = name === "costs" ? null : state[name];
  if (!st) {
    el.querySelectorAll("[data-sort]").forEach(a => a.addEventListener("click", () => { state.used.sort = a.dataset.sort; state.used.shortlist = false; current = ""; }));
    return;
  }
  el.querySelectorAll(".chips[data-f], .seg[data-f]").forEach(c => c.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    st[c.dataset.f] = b.dataset.v;
    if (c.dataset.f === "kind") { st.fuel = ""; st.dt = ""; st.body = ""; st.make = ""; }
    if (c.dataset.f === "dt" || c.dataset.f === "fuel") st.body = "";
    render(name);
  }));
  // Variant buttons redraw only their own card.
  el.addEventListener("click", e => {
    const b = e.target.closest(".vpill"); if (!b) return;
    state.newSel[b.dataset.key] = b.dataset.id;
    const card = b.closest("article.car"), vs = NEW_GROUPS.get(b.dataset.key);
    if (card && vs) card.outerHTML = newCard(vs);
  });
  el.querySelectorAll("select[data-f]").forEach(s => s.addEventListener("change", () => { st[s.dataset.f] = s.value; render(name); }));
  el.querySelectorAll("input[type=checkbox][data-f]").forEach(c => c.addEventListener("change", () => { st[c.dataset.f] = c.checked; render(name); }));
  const q = el.querySelector("input[type=search]");
  if (q) { let t; q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { st.q = q.value.trim().toLowerCase(); const pos = q.selectionStart; render(name); const nq = el.querySelector("input[type=search]"); nq.focus(); nq.setSelectionRange(pos, pos); }, 160); }); }
}
window.addEventListener("hashchange", show);

fetch("live/data.json", {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  D = d;
  const at = new Date(d.generated_at);
  $("#stamp").textContent = "Updated " + at.toLocaleDateString("en-SG", {weekday: "short", day: "numeric", month: "short"}) + ", " + at.toLocaleTimeString("en-SG", {hour: "2-digit", minute: "2-digit"});
  $("#foot-l").textContent = `Built ${at.toLocaleString("en-SG")} from the ${d.run_date} run. Prices and figures are the sites' own; estimates follow config.yaml.`;
  $("#loading").remove();
  show();
}).catch(err => { $("#loading").innerHTML = `<p>Could not load today's data (${esc(err.message)}). The tracker writes it after each morning run.</p>`; });
})();
</script>
</body>
