[project]
name = "sg-car-scraper"
version = "0.1.0"
description = "Daily Singapore car market scraper with a Telegram report"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "rich>=13.7",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
